<style>

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{

.wrap{max-width:760px;margin:0 auto;padding:14px 14px 190px;}

/* hero */
.hero{
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:

.heroMarquee2::before{

.addonPill.sk{background:var(--sk);} .addonPill.kt{background:var(--kt);} .addonPill.lg{background:var(--lg);}
.addonBtn{border:1px solid rgba(15,23,42,.14);background:#fff;padding:10px 12px;border-radius:12px;font-weight:1000;font-size:14px;cursor:pointer;}

/* bottom dock */
.bottomDock{

.dockBtn svg{width:20px;height:20px;stroke: currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.dockBtn.call{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.22);color:#0b3a22;}
.dockBtn.sms{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.22);color:#083244;}
.dockBtn.kakao{background:rgba(254,229,0,.35);border-color:rgba(254,229,0,.55);color:#3b2f00;}

/* =========================
   ✅ 공용 팝업 베이스
   ========================= */
.adBackdrop{

/* =========================
   ✅ TODAY 카드: 쿠팡식 슬라이드 + 프리뷰 + 물결 스케일
   ========================= */
.todaySlider{ position:relative; overflow:hidden; }
.todayTrack{
  display:flex; gap:10px; overflow-x:auto;
  padding: 0 8px; /* ✅ 프리뷰 6~8px */
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  scroll-behavior:smooth;
}
.todayTrack::-webkit-scrollbar{display:none;}

.todayItem{
  flex: 0 0 calc(100% - 16px);
  scroll-snap-align:center;
  border-radius:18px;
  border:1px solid rgba(15,23,42,.10);
  background:#fff;
  box-shadow: 0 12px 24px rgba(15,23,42,.08);
  padding:14px;
  position:relative;
  overflow:hidden;
  transform: scale(1);
  transition: transform .16s ease;
}

/* ✅ 좌→우 그라데이션 번쩍 (0원/마이너스일 때만 ON) */
.todayItem.sweepOn::after{
  content:"";
  position:absolute; inset:-80px;
  background: linear-gradient(90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.0) 35%,
    rgba(255,255,255,.65) 50%,
    rgba(255,255,255,0) 65%,
    rgba(255,255,255,0) 100%);
  transform: translateX(-60%);
  animation: sweep 1.2s linear infinite;
  opacity:.55;
  pointer-events:none;
}
@keyframes sweep{
  0%{ transform: translateX(-70%); }
  100%{ transform: translateX(70%); }
}

/* 상단 “오늘의 초특가” 마퀴 띠 */
.todayMarquee{
  position:absolute; left:0; right:0; top:0;
  height:34px;
  display:flex; align-items:center;
  background: linear-gradient(90deg, rgba(15,23,42,.0), rgba(15,23,42,.06), rgba(15,23,42,.0));
  border-bottom:1px solid rgba(15,23,42,.10);
}
.todayMarquee .bar{ width:100%; height:100%; display:flex; align-items:center; overflow:hidden; }
.todayMarquee .text{
  display:inline-flex; align-items:center; gap:12px;
  white-space:nowrap;
  padding-left:100%;
  animation: marquee 6.5s linear infinite;
  font-weight:1000; letter-spacing:-.4px; font-size:13px;
  color:#fff;
  text-shadow:0 8px 16px rgba(0,0,0,.20);
}
@keyframes marquee{ 0%{ transform: translateX(0); } 100%{ transform: translateX(-100%); } }

/* 통신사별 마퀴 색상 */
.todayItem[data-carrier="SK"] .todayMarquee{ background: linear-gradient(90deg, rgba(37,99,235,.98), rgba(14,165,233,.85)); }
.todayItem[data-carrier="KT"] .todayMarquee{ background: linear-gradient(90deg, rgba(17,24,39,.98), rgba(71,85,105,.90)); }
.todayItem[data-carrier="LG"] .todayMarquee{ background: linear-gradient(90deg, rgba(22,163,74,.98), rgba(34,197,94,.85)); }

/* 내부 배지/모델/가격 */
.todayInner{padding-top:34px;}
.todayBadgeRow{display:flex;align-items:center;justify-content:space-between;gap:10px;}

.todayDisc{margin:6px 0 0;font-size:13px;font-weight:1000;color:#2563eb;}

.todayPrices{

  grid-template-columns:repeat(2, minmax(0, 1fr));

  margin-top:12px;
}
.todayPrices.one{grid-template-columns:1fr;}
.todayPriceBox{

  border:1px solid rgba(15,23,42,.10);
  background: #fff;

.todayPriceBox .k{font-size:12px;font-weight:1000;letter-spacing:-.2px;color: rgba(71,85,105,.95);margin-bottom:6px;}
.todayPriceBox .v{

/* dots */
.todayDots{ display:flex; justify-content:center; gap:6px; padding-top:8px; }

/* =========================
   ✅ 공지: data.csv의 __NOTICE__ 행에서 읽음
   - 없으면 아래 FALLBACK 사용
   ========================= */
const FALLBACK_NOTICE_VERSION = "2026-02-01-01";
const FALLBACK_NOTICE_TITLE   = "KT 위약금 면제 13일 종료 !!!";
const FALLBACK_NOTICE_SUBTITLE= "해당 고객은 조건 확인이 필요합니다. 카톡에 “기종/통신사”만 보내주세요.";

/* ✅ 2시간 간격 - TODAY용 */
const POPUP_INTERVAL_MS = 2 * 60 * 60 * 1000;

  version: FALLBACK_NOTICE_VERSION,
  title: FALLBACK_NOTICE_TITLE,

  tags: FALLBACK_NOTICE_TAGS
};

function normalizeTags(v){
  const s = String(v ?? "").trim();
  if(!s) return [];
  const parts = s.includes("|") ? s.split("|") : s.split(",");
  return parts.map(x=>String(x||"").trim()).filter(Boolean);
}
function readNoticeFromCSVRows(rows){
  const r = rows.find(x => String(x["기종"] ?? "").trim() === "__NOTICE__") || null;
  if(!r) return null;

  const ver = String(r["NOTICE_VERSION"] ?? "").trim();
  const title = String(r["NOTICE_TITLE"] ?? "").trim();
  const sub = String(r["NOTICE_SUBTITLE"] ?? "").trim();
  const tagsRaw = r["NOTICE_TAGS"];

  const next = {
    version: ver || FALLBACK_NOTICE_VERSION,
    title: title || FALLBACK_NOTICE_TITLE,
    subtitle: sub || FALLBACK_NOTICE_SUBTITLE,
    tags: normalizeTags(tagsRaw)
  };
  if(!next.tags.length) next.tags = FALLBACK_NOTICE_TAGS.slice();
  return next;
}

  const get = (t) => (parts.find(p => p.type === t)?.value || "");
  const y = get("year"), m = get("month"), d = get("day");
  return `TODAY_POPUP_BLOCKALL_${y}-${m}-${d}`;
}

/* =========================
   ✅ StorageSafe
   ========================= */
const StorageSafe = (() => {
  const mem = new Map();
  function getStore(){
    try{
      const t="__t__";
      localStorage.setItem(t,"1");
      localStorage.removeItem(t);
      return localStorage;
    }catch(e){
      try{
        const t="__t__";
        sessionStorage.setItem(t,"1");
        sessionStorage.removeItem(t);
        return sessionStorage;
      }catch(e2){
        return null;
      }
    }
  }
  const store = getStore();
  return {
    get(key){
      try{ if(store) return store.getItem(key); }catch(e){}
      return mem.has(key) ? mem.get(key) : null;
    },
    set(key,val){
      try{ if(store) return store.setItem(key, String(val)); }catch(e){}
      mem.set(key, String(val));
    },
    remove(key){
      try{ if(store) return store.removeItem(key); }catch(e){}
      mem.delete(key);
    }
  };
})();

/* 업데이트 날짜/시간 자동 표시 (data.csv Last-Modified) */
async function setUpdateStamp(){
  const el = document.getElementById("updateStamp");
  if(!el) return;
  try{
    const res = await fetch(`data.csv?v=${encodeURIComponent(CSV_VER)}`, { method: "HEAD", cache: "no-store" });
    const lm = res.headers.get("last-modified");
    if(!lm) return;
    const d = new Date(lm);
    const parts = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(d);
    const get = (t) => (parts.find(p => p.type === t)?.value || "");
    el.textContent = `${get("year")}.${get("month")}.${get("day")} ${get("hour")}:${get("minute")}`;
  }catch(e){}
}

/* 관리자 전용 새로고침: 공지바 5번 탭하면 버튼 토글 */
(function adminRefreshToggle(){
  const hero = document.querySelector(".hero");
  const btn = document.getElementById("refreshBtn");
  if(!hero || !btn) return;

  let taps = 0;
  let timer = null;
  const reset = () => { taps = 0; if(timer){ clearTimeout(timer); timer = null; } };

  hero.addEventListener("click", () => {
    taps += 1;
    if(!timer){ timer = setTimeout(() => reset(), 2000); }
    if(taps >= 5){
      const hidden = (getComputedStyle(btn).display === "none");
      btn.style.display = hidden ? "inline-flex" : "none";
      reset();
    }
  }, { passive:true });

  btn.addEventListener("click", (e) => {
    e.preventDefault();
    location.reload();
  });
})();

/* 숫자 판단(색상/정렬용) */
const asNum = (x) => {
  const raw = String(x ?? "").replace(/\u2212/g, "-").replace(/,/g, "").trim();
  if (!raw) return null;
  const m = raw.match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  let n = Number(m[0]);
  if (!Number.isFinite(n)) return null;
  if (raw.includes("만원") || raw.includes("만")) n = n * 10000;
  return n;
};
const showVal = (raw) => {
  const s = String(raw ?? "").replace(/\u2212/g, "-").trim();
  return s === "" ? "" : s;
};
const vClass = (n) => (n === null) ? "" : (n < 0 ? "neg" : (n === 0 ? "zero" : "pos"));

  return "LG 115요금 6개월 / 부가필수 문의";
};

function addAddonCard(carrier){
  const items = ADDON[carrier] || [];
  const pillClass = carrier === "SK" ? "sk" : (carrier === "KT" ? "kt" : "lg");
  const id = `addon_${carrier}`;
  const lis = items.map(x => `
    <li>

    </li>

    <div class="card addonCard" id="${id}">
      <div class="addonHead" role="button" tabindex="0" aria-expanded="false">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <span class="addonPill ${pillClass}">${carrier}</span>
          <span class="addonTitle">부가서비스 유지 조건</span>
        </div>
        <button class="addonBtn" type="button">펼치기</button>
      </div>
      <div class="addonBody">
        <ol class="addonList">${lis}</ol>
      </div>
    </div>
  `);

  const root = document.getElementById(id);
  const head = root.querySelector(".addonHead");
  const btn = root.querySelector(".addonBtn");
  const body = root.querySelector(".addonBody");

  const toggle = () => {
    const open = body.classList.toggle("show");
    head.setAttribute("aria-expanded", open ? "true" : "false");
    btn.textContent = open ? "접기" : "펼치기";
  };

  head.addEventListener("click", (e)=>{ if (e.target === btn) return; toggle(); });
  head.addEventListener("keydown", (e)=>{ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  btn.addEventListener("click", (e)=>{ e.preventDefault(); toggle(); });
}

/* CSV loader */
function parseCSVLine(line){
  const out = [];
  let cur = "";
  let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"'){
      if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
      else inQ = !inQ;
      continue;
    }
    if(ch === "," && !inQ){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}
async function fetchCSV(){
  const r = await fetch(`data.csv?v=${encodeURIComponent(CSV_VER)}`, { cache: "no-store" });
  if (!r.ok) throw new Error("data.csv 로드 실패");
  const t = await r.text();
  const lines = t.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  if (!lines.length) return [];
  const header = parseCSVLine(lines.shift()).map(s => String(s||"").trim());
  return lines.map(line => {
    const cols = parseCSVLine(line);
    const o = {};
    header.forEach((h,i)=> o[h] = String(cols[i] ?? "").trim());
    return o;
  });
}

/* =========================

function getRowBestPrice(row, carrier){
  const mv = asNum(row[`${carrier}_이동`]);
  const ch = asNum(row[`${carrier}_기변`]);
  if(mv === null && ch === null) return Number.POSITIVE_INFINITY;
  if(mv === null) return ch;
  if(ch === null) return mv;
  return Math.min(mv, ch);
}

function escapeHtml(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
function highlightNoticeTitle(t){
  // 숫자 강조 + 마감/종료/오늘/긴급 강조
  let s = escapeHtml(t);
  s = s.replace(/(\d+)/g, '<span class="hlNum">$1</span>');
  s = s.replace(/(마감|종료|오늘|긴급|D-\d+)/g, '<span class="hlClose">$1</span>');
  return s;
}

    const sweepOn = (best !== Number.POSITIVE_INFINITY) && (best <= 0);

    todayTrack.insertAdjacentHTML("beforeend", `

          <div class="bar">

              <div class="todayPriceBox">
                <div class="k">이동</div>
                <div class="v ${vClass(mvNum)}">${escapeHtml(mv)}</div>
              </div>` : ``}
            ${hasChange ? `
              <div class="todayPriceBox">
                <div class="k">기변</div>
                <div class="v ${vClass(chNum)}">${escapeHtml(ch)}</div>
              </div>` : ``}
          </div>
        </div>
      </div>
    `);

    todayDots.insertAdjacentHTML("beforeend", `<div class="todayDot ${idx===0 ? "active" : ""}"></div>`);
  });

  // dots 활성 처리
  const items = Array.from(todayTrack.querySelectorAll(".todayItem"));
  const dots = Array.from(todayDots.querySelectorAll(".todayDot"));
  function setActive(i){
    dots.forEach((d,idx)=> d.classList.toggle("active", idx===i));
  }
  todayTrack.addEventListener("scroll", ()=>{
    const left = todayTrack.scrollLeft;
    const w = todayTrack.clientWidth;
    // center 기준으로 가장 가까운 index
    let bestIdx = 0;
    let bestDist = Infinity;
    items.forEach((el, idx)=>{
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const containerRect = todayTrack.getBoundingClientRect();
      const cc = containerRect.left + containerRect.width/2;
      const dist = Math.abs(cx - cc);
      if(dist < bestDist){ bestDist = dist; bestIdx = idx; }
    });
    setActive(bestIdx);
  }, { passive:true });
}

  hideModal(todayModal);
});
document.getElementById("todayOkBtn").addEventListener("click", ()=>{
  if(todayNoShowToday.checked){
    StorageSafe.set(getTodayBlockAllKey(), "1");
  }
  markTodayShown();
  hideModal(todayModal);
});

/* =========================
   ✅ 탭 이벤트
   ========================= */
serviceTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".tabBtn");
  if(!b) return;
  const next = b.dataset.mode;
  if(next === "MVNO"){
    mode = "MVNO";
    setServiceActive("MVNO");
    hideAllSubTabs();
    showMvnoTabs(true);
    showInternetTabs(false);
    // 휴대폰 탭 비활성 느낌(숨기진 않음)
    renderMVNO(mvnoNet);
    activateMvnoNet(mvnoNet);
  }else if(next === "INTERNET"){
    mode = "INTERNET";
    setServiceActive("INTERNET");
    hideAllSubTabs();
    showInternetTabs(true);
    showMvnoTabs(false);
    renderInternet(inetCarrier);
    activateInetCarrier(inetCarrier);
  }
});

phoneTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".tabBtn");
  if(!b) return;
  const tab = b.dataset.tab;
  mode = "PHONE";
  setServiceActive(null);
  hideAllSubTabs();
  activatePhoneTab(tab);
  // rows는 전역에 저장(로드 후)
  if(window.__CSV_ROWS__) renderPhone(window.__CSV_ROWS__, tab);
});

mvnoTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".subTabBtn");
  if(!b) return;
  const net = b.dataset.mvno;
  activateMvnoNet(net);
  renderMVNO(net);
});
internetTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".subTabBtn");
  if(!b) return;
  const c = b.dataset.inet;
  activateInetCarrier(c);
  renderInternet(c);
});

/* =========================
   ✅ 초기 로딩
   ========================= */
(async function init(){
  showLoading("data.csv 불러오는 중…");
  await setUpdateStamp();

  try{
    const rows = await fetchCSV();
    window.__CSV_ROWS__ = rows;

    // ✅ 공지 읽기
    const n = readNoticeFromCSVRows(rows);
    if(n) NOTICE = n;

    // ✅ 기본 화면: PHONE (SK)
    mode = "PHONE";
    setServiceActive(null);
    hideAllSubTabs();
    activatePhoneTab(lastPhoneTab);
    renderPhone(rows, lastPhoneTab);

    // ✅ 공지 팝업(버전 기준)
    setTimeout(()=> maybeShowNoticePopup(), 300);

    // ✅ TODAY 팝업(2시간 기준)
    const todayRows = rows.filter(isTodayRow).filter(r => String(r["기종"] ?? "").trim() !== "__NOTICE__");
    if(todayRows.length){
      buildTodayCards(todayRows);
      setTimeout(()=>{
        if(shouldShowTodayPopup()){
          showModal(todayModal);
        }
      }, POPUP_FIRST_DELAY_MS);
      // 열린 상태에서도 2시간마다 체크
      setInterval(()=>{
        if(shouldShowTodayPopup()){
          // 오늘 차단 체크박스는 항상 false로 초기화(사용자가 다시 선택할 수 있게)
          todayNoShowToday.checked = false;
          showModal(todayModal);
        }
      }, 30 * 1000); // 30초마다 조건 확인(가볍게)
    }

  }catch(err){
    console.error(err);
    showLoading("data.csv를 불러오지 못했습니다. 파일명/경로를 확인해주세요.");
  }
})();
</script>
