<script>
const list = document.getElementById("list");
const phoneTabsEl = document.getElementById("phoneTabs");
const serviceTabsEl = document.getElementById("serviceTabs");

const internetTabsEl = document.getElementById("internetTabs");

const CSV_VER = "2025-12-23";
const KAKAO_URL = "https://open.kakao.com/o/s729bI5h";

let mode = "PHONE";
let lastPhoneTab = "SK";
let mvnoNet = "LG";
let inetCarrier = "SK";

const ADDON = {
  SK: [{ t:"마이스마트콜(3,500)", d:"3개월 유지 / 미 가입시 +2" }],
  KT: [
    { t:"필수팩(9,900)", d:"4개월 유지 / 미 가입시 +5" },
    { t:"보험(모델별 상이)", d:"4개월 유지 / 미 가입시 +3" },
    { t:"티빙 스탠다드+메가커피(13,500)", d:"4개월 유지 / 미 가입시 +5" }
  ],
  LG: [
    { t:"통화편의+구글원(10,300)", d:"95일 유지 / 미 가입시 +5" },
    { t:"V컬+음악+벨링(15,400)", d:"95일 유지 / 미 가입시 +5" },
    { t:"폰교체보험(모델별 상이)", d:"95일 유지 / 미 가입시 +5" },
    { t:"익시오(무료)", d:"95일 유지 / 미 가입시 +3" }
  ],
};

const asNum = (x) => {
  const raw = String(x ?? "").replace(/\u2212/g, "-").replace(/,/g, "").trim();
  if (!raw) return null;
  const m = raw.match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  let n = Number(m[0]);
  if (!Number.isFinite(n)) return null;
  if (raw.includes("만원") || raw.includes("만")) n = n * 10000;
  return n;
};
const showVal = (raw) => {
  const s = String(raw ?? "").replace(/\u2212/g, "-").trim();
  return s === "" ? "" : s;
};
const vClass = (n) => (n === null) ? "" : (n < 0 ? "neg" : (n === 0 ? "zero" : "pos"));

function esc(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function onlyDigits(s){
  const v = String(s ?? "").trim();
  const m = v.match(/\d+/);
  return m ? m[0] : "";
}

const fixedInfoLine = (c) => {
  if (c === "SK") return `이동: SK 109요금 6개월<br>기변: SK 109요금 6개월<span class="subHint">부가서비스 유지조건 클릭</span>`;
  if (c === "KT") return `이동: KT 110요금 6개월<br>기변: KT 110요금 6개월<span class="subHint">부가서비스 유지조건 클릭</span>`;
  return `이동: LG 115요금 6개월<br>기변: LG 115요금 6개월<span class="subHint">부가서비스 유지조건 클릭</span>`;
};

const infoLineWithPlan = (c, row) => {
  const moveRaw   = row?.[`${c}_요금제`];
  const chgRaw    = row?.[`${c}_요금제.1`];

  const movePlan  = onlyDigits(moveRaw);
  const changePlan= onlyDigits(chgRaw);

  if(!movePlan && !changePlan) return fixedInfoLine(c);

  const m = movePlan || changePlan;
  const k = changePlan || movePlan;

  return `이동: ${esc(c)} ${esc(m)}요금 6개월<br>기변: ${esc(c)} ${esc(k)}요금 6개월<span class="subHint">부가서비스 유지조건 클릭</span>`;
};

function clearList(){ list.innerHTML = ""; }
function showLoading(msg="불러오는 중…"){
  clearList();
  list.insertAdjacentHTML("beforeend", `<div class="loading">${esc(msg)}</div>`);
}

function setServiceActive(next){
  serviceTabsEl.querySelectorAll(".tabBtn").forEach(b => b.classList.remove("active"));
  if (!next) return;
  const el = serviceTabsEl.querySelector(`[data-mode="${next}"]`);
  if (el) el.classList.add("active");
}
function hideAllSubTabs(){
  mvnoTabsEl.classList.remove("show");
  internetTabsEl.classList.remove("show");
}
function activatePhoneTab(tab){
  phoneTabsEl.querySelectorAll(".tabBtn").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === tab);
  });
  lastPhoneTab = tab;
}
function showMvnoTabs(show){ show ? mvnoTabsEl.classList.add("show") : mvnoTabsEl.classList.remove("show"); }
function showInternetTabs(show){ show ? internetTabsEl.classList.add("show") : internetTabsEl.classList.remove("show"); }
function activateMvnoNet(net){
  mvnoNet = net;
  mvnoTabsEl.querySelectorAll(".subTabBtn").forEach(b=>{
    b.classList.toggle("active", b.dataset.mvno === net);
  });
}
function activateInetCarrier(c){
  inetCarrier = c;
  internetTabsEl.querySelectorAll(".subTabBtn").forEach(b=>{
    b.classList.toggle("active", b.dataset.inet === c);
  });
}

function addAddonCard(carrier){
  const items = ADDON[carrier] || [];
  const pillClass = carrier === "SK" ? "sk" : (carrier === "KT" ? "kt" : "lg");
  const id = `addon_${carrier}`;
  const lis = items.map(x => `
    <li>
      ${esc(x.t)}
      <div class="sub">${esc(x.d)}</div>
    </li>
  `).join("");

  list.insertAdjacentHTML("beforeend", `
    <div class="card addonCard" id="${id}">
      <div class="addonHead" role="button" tabindex="0" aria-expanded="false">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <span class="addonPill ${pillClass}">${esc(carrier)}</span>
          <span class="addonTitle">부가서비스 유지 조건</span>
        </div>
        <span class="addonChevron" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </span>
      </div>
      <div class="addonBody">
        <ol class="addonList">${lis}</ol>
      </div>
    </div>
  `);

  const root = document.getElementById(id);
  const head = root.querySelector(".addonHead");
  const body = root.querySelector(".addonBody");

  const toggle = () => {
    const open = body.classList.toggle("show");
    head.setAttribute("aria-expanded", open ? "true" : "false");
    root.classList.toggle("open", open);
  };

  head.addEventListener("click", (e)=>{ e.preventDefault(); toggle(); });
  head.addEventListener("keydown", (e)=>{
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });
}

function isDiscountRow(x){
  const v = String(x["요금할인"] ?? "").trim().toLowerCase();
  return (v === "o" || v === "1" || v === "true" || v === "y" || v === "yes" || v === "on");
}

function addPhoneCard({badgeText, badgeClass, model, move, change, infoText, discount}){
  const mv = (move ?? "");
  const ch = (change ?? "");
  const mvNum = asNum(mv);
  const chNum = asNum(ch);
  const hasMove = (mv !== "");
  const hasChange = (ch !== "");
  const rowClass = (hasMove && hasChange) ? "" : "one";

  list.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="titleRow">
        <div class="model">${esc(model)}</div>
        <div class="badge ${badgeClass}">${esc(badgeText)}</div>
      </div>

      ${infoText ? `<p class="infoLine">${infoText}</p>` : ``}
      ${discount ? `<div class="discountPill">요금할인 <strong>25%</strong></div>` : ``}

      <div class="priceRow ${rowClass}">
        ${hasMove ? `
          <div class="pill">
            <div class="k">이동</div>
            <div class="v ${vClass(mvNum)}">${esc(mv)}</div>
          </div>` : ``}
        ${hasChange ? `
          <div class="pill">
            <div class="k">기변</div>
            <div class="v ${vClass(chNum)}">${esc(ch)}</div>
          </div>` : ``}
      </div>
    </div>
  `);
}

/* CSV loader */
function parseCSVLine(line){
  const out = [];
  let cur = "";
  let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"'){
      if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
      else inQ = !inQ;
      continue;
    }
    if(ch === "," && !inQ){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}

/* ✅✅✅ 핵심 수정: 중복 헤더 자동 .1 부여 */
function makeUniqueHeader(rawHeader){
  const seen = Object.create(null);
  return rawHeader.map(h=>{
    const key = String(h||"").trim();
    if(!seen[key]){
      seen[key] = 1;
      return key;
    }
    const idx = seen[key];
    seen[key] = idx + 1;
    return `${key}.${idx}`;  // 두번째가 .1
  });
}

async function fetchCSV(){
  const r = await fetch(`data.csv?v=${encodeURIComponent(CSV_VER)}`, { cache: "no-store" });
  if (!r.ok) throw new Error("data.csv 로드 실패");
  const t = await r.text();
  const lines = t.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  if (!lines.length) return [];

  const rawHeader = parseCSVLine(lines.shift());
  const header = makeUniqueHeader(rawHeader);

  return lines.map(line => {
    const cols = parseCSVLine(line);
    const o = {};
    header.forEach((h,i)=> o[h] = String(cols[i] ?? "").trim());
    return o;
  });
}

function getRowBestPrice(row, carrier){
  const mv = asNum(row[`${carrier}_이동`]);
  const ch = asNum(row[`${carrier}_기변`]);
  if(mv === null && ch === null) return Number.POSITIVE_INFINITY;
  if(mv === null) return ch;
  if(ch === null) return mv;
  return Math.min(mv, ch);
}

function renderPhone(rows, carrier){
  clearList();
  addAddonCard(carrier);

  const filtered = rows
    .filter(r => String(r["기종"] ?? "").trim() !== "__NOTICE__")
    .filter(r => {
      const mv = showVal(r[`${carrier}_이동`]);
      const ch = showVal(r[`${carrier}_기변`]);
      return (mv !== "" || ch !== "");
    })
    .sort((a,b)=> (getRowBestPrice(a, carrier) - getRowBestPrice(b, carrier)));

  if(!filtered.length){
    list.insertAdjacentHTML("beforeend", `<div class="loading">표시할 카드가 없습니다.</div>`);
    return;
  }

  filtered.forEach(r=>{
    const model = String(r["기종"] ?? "").trim() || "-";
    const move = showVal(r[`${carrier}_이동`]);
    const change = showVal(r[`${carrier}_기변`]);
    const discount = isDiscountRow(r);

    addPhoneCard({
      badgeText: carrier,
      badgeClass: carrier === "SK" ? "sk" : carrier === "KT" ? "kt" : "lg",
      model,
      move,
      change,
      infoText: infoLineWithPlan(carrier, r),
      discount
    });
  });
}

/* 탭 이벤트 */
serviceTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".tabBtn");
  if(!b) return;
  const next = b.dataset.mode;

  if(next === "MVNO"){
    mode = "MVNO";
    setServiceActive("MVNO");
    hideAllSubTabs();
    showMvnoTabs(true);
    showInternetTabs(false);
    clearList();
    list.insertAdjacentHTML("beforeend", `<div class="loading">알뜰요금 데이터는 기존 코드 그대로 쓰면 됩니다.</div>`);
    activateMvnoNet(mvnoNet);
  }else if(next === "INTERNET"){
    mode = "INTERNET";
    setServiceActive("INTERNET");
    hideAllSubTabs();
    showInternetTabs(true);
    showMvnoTabs(false);
    clearList();
    list.insertAdjacentHTML("beforeend", `<div class="loading">인터넷TV 데이터는 기존 코드 그대로 쓰면 됩니다.</div>`);
    activateInetCarrier(inetCarrier);
  }
});

phoneTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".tabBtn");
  if(!b) return;
  const tab = b.dataset.tab;
  mode = "PHONE";
  setServiceActive(null);
  hideAllSubTabs();
  activatePhoneTab(tab);
  if(window.__CSV_ROWS__) renderPhone(window.__CSV_ROWS__, tab);
});

/* 업데이트 날짜/시간 자동 표시 (data.csv Last-Modified) */
async function setUpdateStamp(){
  const el = document.getElementById("updateStamp");
  if(!el) return;
  try{
    const res = await fetch(`data.csv?v=${encodeURIComponent(CSV_VER)}`, { method: "HEAD", cache: "no-store" });
    const lm = res.headers.get("last-modified");
    if(!lm) return;
    const d = new Date(lm);
    const parts = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(d);
    const get = (t) => (parts.find(p => p.type === t)?.value || "");
    el.textContent = `${get("year")}.${get("month")}.${get("day")} ${get("hour")}:${get("minute")}`;
  }catch(e){}
}

/* 초기 로딩 */
(async function init(){
  showLoading("data.csv 불러오는 중…");
  await setUpdateStamp();

  try{
    const rows = await fetchCSV();
    window.__CSV_ROWS__ = rows;

    mode = "PHONE";
    setServiceActive(null);
    hideAllSubTabs();
    activatePhoneTab(lastPhoneTab);
    renderPhone(rows, lastPhoneTab);
  }catch(err){
    console.error(err);
    showLoading("data.csv를 불러오지 못했습니다. 파일명/경로를 확인해주세요.");
  }
})();
</script>
