// Utility Functions
function asNum(v) {
  if (v == null || v === '') return Infinity;
  const s = String(v).replace(/[^0-9.-]/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? Infinity : n;
}

function fmtWon(v) {
  const n = asNum(v);
  if (n === Infinity) return '-';
  if (n === 0) return '0';
  if (n < 0) return n.toLocaleString() + '원';
  return n.toLocaleString() + '원';
}

function showToast(message, duration = 3000) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

function updateLastUpdate() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('lastUpdate').textContent = timeStr;
}

// Wishlist
function loadWishlist() {
  const saved = localStorage.getItem('wishlist');
  if (saved) {
    wishlist = JSON.parse(saved);
  }
  updateWishlistBadge();
}

function saveWishlist() {
  localStorage.setItem('wishlist', JSON.stringify(wishlist));
}

function toggleWishlist(cardId, cardData) {
  const index = wishlist.findIndex(w => w.id === cardId);
  
  if (index > -1) {
    wishlist.splice(index, 1);
    saveWishlist();
    updateWishlistBadge();
    showToast('찜 목록에서 제거되었습니다');
    return false;
  } else {
    const item = {
      id: cardId,
      ...cardData,
      timestamp: Date.now()
    };
    wishlist.push(item);
    saveWishlist();
    updateWishlistBadge();
    showToast('❤️ 찜 목록에 추가되었습니다');
    return true;
  }
}

function isWishlisted(cardId) {
  return wishlist.some(w => w.id === cardId);
}

function updateWishlistBadge() {
  const badge = document.getElementById('wishlistTabBadge');
  if (wishlist.length > 0) {
    badge.textContent = wishlist.length;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function renderWishlist() {
  const container = document.getElementById('list');
  
  if (wishlist.length === 0) {
    container.innerHTML = `
      <div class="emptyWishlist">
        <div class="icon">❤️</div>
        <h3>찜한 상품이 없습니다</h3>
        <p>마음에 드는 상품을 찜해보세요</p>
        <button onclick="goToPhoneTab()">상품 둘러보기</button>
      </div>
    `;
    return;
  }

  container.innerHTML = '<h2 style="padding:20px 16px; font-size:1.3rem;">찜 목록 (' + wishlist.length + '개)</h2>';

  wishlist.forEach(item => {
    addPhoneCard({
      model: item.model,
      carrier: item.carrier,
      move: item.move,
      change: item.change,
      moveRaw: item.moveRaw,
      changeRaw: item.changeRaw,
      discount: item.discount,
      cardId: item.id
    });
  });
}

window.goToPhoneTab = function() {
  MODE = 'PHONE';
  document.querySelectorAll('.tabBtn.svc').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === 'PHONE');
  });
  render();
};

// Rendering
function render() {
  const listEl = document.getElementById('list');
  const phoneTabsEl = document.getElementById('phoneTabs');
  const mvnoTabsEl = document.getElementById('mvnoTabs');
  const internetTabsEl = document.getElementById('internetTabs');
  const viewModeEl = document.getElementById('viewModeTabs');
  const searchEl = document.getElementById('searchSection');

  phoneTabsEl.style.display = 'none';
  mvnoTabsEl.style.display = 'none';
  internetTabsEl.style.display = 'none';
  viewModeEl.style.display = 'none';
  searchEl.style.display = 'none';

  listEl.innerHTML = '';

  if (MODE === 'PHONE') {
    phoneTabsEl.style.display = 'flex';
    viewModeEl.style.display = 'flex';
    searchEl.style.display = 'block';
    renderPhone();
  } else if (MODE === 'MVNO') {
    mvnoTabsEl.style.display = 'flex';
    renderMVNO();
  } else if (MODE === 'INTERNET') {
    internetTabsEl.style.display = 'flex';
    renderINTERNET();
  } else if (MODE === 'WISHLIST') {
    renderWishlist();
  }
}

function renderPhone() {
  const rows = window.__CSV_ROWS__.filter(row => {
    const carrier = row['통신사'] || row['carrier'] || '';
    return carrier === CARRIER;
  });

  let filtered = rows;
  if (SEARCH_QUERY) {
    const query = SEARCH_QUERY.toLowerCase();
    filtered = filtered.filter(row => {
      const model = (row['모델명'] || row['model'] || '').toLowerCase();
      return model.includes(query);
    });
  }

  filteredRows = filtered;

  const container = document.getElementById('list');
  
  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="emptyState">
        <div class="icon">📱</div>
        <h3>검색 결과가 없습니다</h3>
        <p>다른 검색어를 입력해보세요</p>
      </div>
    `;
    return;
  }

  filtered.forEach(row => {
    const model = row['모델명'] || row['model'] || '';
    const carrier = row['통신사'] || row['carrier'] || '';
    const move = fmtWon(row['이동'] || row['move']);
    const change = fmtWon(row['기변'] || row['change']);
    const moveRaw = asNum(row['이동'] || row['move']);
    const changeRaw = asNum(row['기변'] || row['change']);
    const discount = row['요금할인'] || row['discount'] || '';
    const hasDiscount = discount === 'O' || discount === '1' || discount === 'true' || discount === true;

    addPhoneCard({ model, carrier, move, change, moveRaw, changeRaw, discount: hasDiscount });
  });
}

function addPhoneCard(params) {
  const { model, carrier, move, change, moveRaw, changeRaw, discount, cardId } = params;
  
  const id = cardId || `card_${Date.now()}_${Math.random()}`;
  const wishlisted = isWishlisted(id);

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.cardId = id;

  const badgeClass = carrier.toLowerCase();
  const moveClass = asNum(move) < 0 ? 'minus' : asNum(move) === 0 ? 'zero' : '';
  const changeClass = asNum(change) < 0 ? 'minus' : asNum(change) === 0 ? 'zero' : '';

  card.innerHTML = `
    <div class="badge ${badgeClass}">${carrier}</div>
    <div class="model">${model}</div>
    <div class="pills">
      <div class="pill">
        <span class="k">이동</span>
        <span class="v ${moveClass}">${move}</span>
      </div>
      <div class="pill">
        <span class="k">기변</span>
        <span class="v ${changeClass}">${change}</span>
      </div>
      ${discount ? '<div class="pill" style="background:#fef3c7;border:2px solid #f59e0b;"><span class="k">요금할인</span><span class="v">O</span></div>' : ''}
    </div>
    <button class="favoriteBtn ${wishlisted ? 'active' : ''}" onclick="handleFavorite(event, '${id}')">
      ${wishlisted ? '❤️' : '🤍'}
    </button>
  `;

  document.getElementById('list').appendChild(card);
}

window.handleFavorite = function(event, cardId) {
  event.stopPropagation();
  
  const card = document.querySelector(`[data-card-id="${cardId}"]`);
  const model = card.querySelector('.model').textContent;
  const carrier = card.querySelector('.badge').textContent;
  const pills = card.querySelectorAll('.pill');
  
  let move = '', change = '', moveRaw = 0, changeRaw = 0;
  
  pills.forEach(pill => {
    const label = pill.querySelector('.k').textContent;
    const value = pill.querySelector('.v').textContent;
    
    if (label === '이동') {
      move = value;
      moveRaw = asNum(value);
    } else if (label === '기변') {
      change = value;
      changeRaw = asNum(value);
    }
  });

  const cardData = { model, carrier, move, change, moveRaw, changeRaw, discount: false };
  const added = toggleWishlist(cardId, cardData);
  
  const btn = card.querySelector('.favoriteBtn');
  btn.textContent = added ? '❤️' : '🤍';
  btn.classList.toggle('active', added);
};

function renderMVNO() {

  container.innerHTML = `
    <div class="addonsSection">
      ${Object.keys(ADDON).map(c => {

      }).join('')}

  plans.forEach(plan => {

        <div class="pill">

          <span class="v">${plan.data}</span>
        </div>
        <div class="pill">
          <span class="k">월 요금</span>
          <span class="v">${fmtWon(plan.fee)}</span>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

window.toggleAddon = function(header) {
  const parent = header.parentElement;
  parent.classList.toggle('open');
};

function renderINTERNET() {
  const container = document.getElementById('list');
  const plans = INET_PLANS[CARRIER] || [];

  plans.forEach(plan => {
    const card = document.createElement('div');
    card.className = 'card';
    
    const tvLabel = plan.tv === 'X' ? '인터넷 단독' : `인터넷 + ${plan.tv}`;
    const discount = plan.fee - plan.combo;
    
    card.innerHTML = `
      <div class="badge ${CARRIER.toLowerCase()}">${CARRIER}</div>
      <div class="model">${plan.inet} ${tvLabel}</div>
      <div class="pills">
        <div class="pill">
          <span class="k">정상가</span>
          <span class="v">${fmtWon(plan.fee)}</span>
        </div>
        <div class="pill">
          <span class="k">결합시</span>
          <span class="v">${fmtWon(plan.combo)}</span>
        </div>
        ${discount > 0 ? `
          <div class="pill">
            <span class="k">할인</span>
            <span class="v">${fmtWon(discount)}</span>
          </div>
        ` : ''}
      </div>
    `;
    container.appendChild(card);
  });
}
