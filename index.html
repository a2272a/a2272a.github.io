<style>

  --bg:#f5f6f8; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e5e7eb;
  --sk:#2563eb; --kt:#111827; --lg:#16a34a; --hot:#f97316; --low:#7c3aed;
  --call:#22c55e; --sms:#38bdf8; --kakao:#fee500;

  --ledBg:#070b12; --ledBg2:#0b1220; --ledBorder:rgba(255,255,255,.14);

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 190px;}

/* hero */
.hero{
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(900px 160px at 50% 0%, rgba(0,255,180,.10), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.05) 0%, rgba(0,0,0,.22) 100%),
    linear-gradient(90deg, var(--ledBg) 0%, var(--ledBg2) 50%, var(--ledBg) 100%);

  box-shadow:0 14px 34px rgba(0,0,0,.18), 0 0 0 2px rgba(255,255,255,.10);
}
.heroMarquee2{min-height:52px;display:flex;align-items:center;padding:10px 12px;position:relative;}
.heroMarquee2::before{
  content:"";position:absolute; inset:0;
  background: radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1.9px);
  background-size: 8px 8px;opacity:.22;pointer-events:none;
}
.marqueeLine{
  width:100%;
  height:auto;
  display:flex;align-items:center;justify-content:space-between;overflow:hidden;
  padding:6px 10px;border-radius:14px;background: rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.10);box-shadow: inset 0 12px 20px rgba(0,0,0,.34);

}
.marqueeInner{display:flex;align-items:center;min-width:0;flex:1;}

/* 업데이트 문구 */

  gap:14px;

}
.updateWrap .line1,
.updateWrap .line2{

  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}
@media (max-width:480px){

  .updateWrap .line1,.updateWrap .line2{font-size:16px;white-space:normal;}

/* 관리자 새로고침 버튼(기본 숨김) */
.heroRefreshBtn{

/* tabs */
.tabs{display:flex;gap:8px;margin-top:12px;}

.tabBtn.lg.active{background:var(--lg);}

.tabBtn.svc.internet.active{background:var(--kt);}

.panel{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;}

/* sub tabs */
.subTabs{display:none;gap:8px;margin:0 0 12px;}
.subTabs.show{ display:flex; }
.subTabBtn{

.list{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;}
@media (max-width: 420px){ .list{ grid-template-columns:1fr; } }

.card{border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
.titleRow{display:flex;justify-content:space-between;margin-bottom:8px;gap:10px;align-items:center;}
.model{font-weight:1000;font-size:16px;letter-spacing:-.2px;}

.badge.sk{background:var(--sk);} .badge.kt{background:var(--kt);} .badge.lg{background:var(--lg);}
.badge.hot{background:var(--hot);} .badge.low{background:var(--low);}

.infoLine{font-size:12px;font-weight:1000;color:var(--muted);margin:0 0 6px;}
.discountLine{font-size:12px;font-weight:1000;color:#2563eb;margin:0 0 8px;}

/* price row */
.priceRow{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
}
.priceRow.one{ grid-template-columns:1fr; }

.pill{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fafafa;min-width:0;}
.pill .k{font-size:12px;color:var(--muted);font-weight:1000;margin-bottom:4px;}
.pill .v{font-size:20px;font-weight:1000;letter-spacing:-.4px;}

/* notice card */
.noticeCard{

}
.noticeCard .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.noticeCard .twrap{display:flex;flex-direction:column;gap:4px;}
.noticeCard .t1{font-size:13px;font-weight:1000;letter-spacing:-.2px;color:#0f172a;line-height:1.2;}
.noticeCard .t2{font-size:12px;font-weight:1000;letter-spacing:-.2px;color:var(--muted);line-height:1.2;}
.noticeCard a{

}

/* addon */
.addonCard{
  grid-column:1/-1;
  padding:14px;
  border-radius:14px;

}
.addonHead{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;}
.addonTitle{font-size:16px;font-weight:1000;letter-spacing:-.2px;color:#0f172a;}
.addonPill{font-size:13px;font-weight:1000;padding:7px 11px;border-radius:999px;color:#fff;white-space:nowrap;}
.addonPill.sk{background:var(--sk);} .addonPill.kt{background:var(--kt);} .addonPill.lg{background:var(--lg);}
.addonBtn{border:1px solid rgba(15,23,42,.14);background:#fff;padding:10px 12px;border-radius:12px;font-weight:1000;font-size:14px;cursor:pointer;}
.addonBody{margin-top:12px;display:none;}
.addonBody.show{display:block;}
.addonList{margin:0;padding-left:18px;}
.addonList li{margin:10px 0;font-size:15px;font-weight:1000;color:#0f172a;line-height:1.25;}
.addonList .sub{margin-top:4px;font-size:14px;font-weight:1000;color:var(--muted);}

/* bottom dock */
.bottomDock{
  position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  height:60px;padding:8px;display:flex;gap:10px;border-radius:18px;
  background:rgba(255,255,255,.88);border:1px solid rgba(15,23,42,.10);
  box-shadow:0 14px 34px rgba(15,23,42,.14);backdrop-filter: blur(10px) saturate(160%);
  z-index:999;
}
.dockBtn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;
  text-decoration:none;font-weight:1000;font-size:16px;letter-spacing:-.2px;
  border:1px solid rgba(15,23,42,.10);background:#fff;color:#0f172a;
  box-shadow:0 8px 18px rgba(15,23,42,.08);
}
.dockBtn:active{transform: translateY(1px);box-shadow:0 6px 14px rgba(15,23,42,.10);filter: brightness(.98);}
.dockBtn svg{width:20px;height:20px;stroke: currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.dockBtn.call{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.22);color:#0b3a22;}
.dockBtn.sms{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.22);color:#083244;}
.dockBtn.kakao{background:rgba(254,229,0,.35);border-color:rgba(254,229,0,.55);color:#3b2f00;}

/* =========================
   ✅ 공용 팝업 베이스
   ========================= */
.adBackdrop{
  position:fixed; inset:0;
  background: rgba(15,23,42,.45);
  opacity:0; pointer-events:none;
  transition: opacity .18s ease;
  z-index:2000;
}
.adModal{
  position:fixed; inset:0;
  display:flex; align-items:flex-end; justify-content:center;

  transition: opacity .18s ease;

}
.adModal.show, .adBackdrop.show{ opacity:1; pointer-events:auto; }

.adSheet{

    linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.86) 100%),
    linear-gradient(90deg, var(--adBg1) 0%, var(--adBg2) 50%, var(--adBg1) 100%);

}

.adTopRow{

}
.adTitleWrap{display:flex;flex-direction:column;gap:4px;min-width:0;}
.adTitle1{

}

.adBody{

}

.adCTAs{display:flex;gap:10px;align-items:stretch;}
.adBtn{
  flex:1;
  display:flex;

.adBtn.kakao{

}

.adFoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding: 2px 2px 10px;}

}
.adCheck input{width:18px;height:18px; accent-color: #22c55e;}
.adSmall{color: rgba(71,85,105,.85);font-weight:1000;font-size:12px;}

/* =========================
   ✅ TODAY 카드: 쿠팡식 슬라이드 + 프리뷰 + 물결 스케일
   ========================= */
.todaySlider{ position:relative; overflow:hidden; }
.todayTrack{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding: 0 8px; /* ✅ 프리뷰 6~8px */
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  scroll-behavior:smooth;
}
.todayTrack::-webkit-scrollbar{display:none;}

.todayItem{
  flex: 0 0 calc(100% - 16px);
  scroll-snap-align:center;
  border-radius:18px;
  border:1px solid rgba(15,23,42,.10);
  background:#fff;
  box-shadow: 0 12px 24px rgba(15,23,42,.08);
  padding:14px;
  position:relative;
  overflow:hidden;
  transform: scale(1);
  transition: transform .16s ease;
}

/* ✅ 좌→우 그라데이션 번쩍 (0원/마이너스일 때만 ON) */
.todayItem.sweepOn::after{
  content:"";
  position:absolute; inset:-80px;
  background: linear-gradient(90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.0) 35%,
    rgba(255,255,255,.65) 50%,
    rgba(255,255,255,0) 65%,
    rgba(255,255,255,0) 100%);
  transform: translateX(-60%);
  animation: sweep 1.2s linear infinite;
  opacity:.55;
  pointer-events:none;
}
@keyframes sweep{
  0%{ transform: translateX(-70%); }
  100%{ transform: translateX(70%); }
}

/* 상단 “오늘의 초특가” 마퀴 띠 */
.todayMarquee{
  position:absolute; left:0; right:0; top:0;
  height:34px;
  display:flex; align-items:center;
  background: linear-gradient(90deg, rgba(15,23,42,.0), rgba(15,23,42,.06), rgba(15,23,42,.0));
  border-bottom:1px solid rgba(15,23,42,.10);
}
.todayMarquee .bar{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  overflow:hidden;
}
.todayMarquee .text{
  display:inline-flex;
  align-items:center;
  gap:12px;
  white-space:nowrap;
  padding-left:100%;
  animation: marquee 6.5s linear infinite;
  font-weight:1000;
  letter-spacing:-.4px;
  font-size:13px;
  color:#fff;
  text-shadow:0 8px 16px rgba(0,0,0,.20);
}
@keyframes marquee{
  0%{ transform: translateX(0); }
  100%{ transform: translateX(-100%); }
}

/* 통신사별 마퀴 색상 */
.todayItem[data-carrier="SK"] .todayMarquee{ background: linear-gradient(90deg, rgba(37,99,235,.98), rgba(14,165,233,.85)); }
.todayItem[data-carrier="KT"] .todayMarquee{ background: linear-gradient(90deg, rgba(17,24,39,.98), rgba(71,85,105,.90)); }
.todayItem[data-carrier="LG"] .todayMarquee{ background: linear-gradient(90deg, rgba(22,163,74,.98), rgba(34,197,94,.85)); }

/* 내부 배지/모델/가격 */
.todayInner{padding-top:34px;} /* 마퀴 높이만큼 */
.todayBadgeRow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.todayTag{
  display:inline-flex;align-items:center;gap:8px;
  font-weight:1000;font-size:12px;

  background: linear-gradient(90deg, rgba(239,68,68,.96), rgba(245,158,11,.96));

.todayCarrier{

}
.todayCarrier.sk{background:var(--sk);}
.todayCarrier.kt{background:var(--kt);}
.todayCarrier.lg{background:var(--lg);}

.todayModel{

  font-weight:1000;
  letter-spacing:-1px;
  color: var(--adInk);
  font-size:26px;
  line-height:1.15;

}
@media (max-width:420px){ .todayModel{font-size:24px;} }

.todayInfo{margin:8px 0 0;font-size:13px;font-weight:1000;letter-spacing:-.2px;color:var(--adMuted);}
.todayDisc{margin:6px 0 0;font-size:13px;font-weight:1000;color:#2563eb;}

.todayPrices{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  margin-top:12px;
}
.todayPrices.one{grid-template-columns:1fr;}
.todayPriceBox{
  border-radius:16px;
  border:1px solid rgba(15,23,42,.10);
  background: #fff;
  box-shadow: 0 10px 18px rgba(15,23,42,.08);
  padding:12px 12px 14px;
  text-align:center;
}
.todayPriceBox .k{font-size:12px;font-weight:1000;letter-spacing:-.2px;color: rgba(71,85,105,.95);margin-bottom:6px;}
.todayPriceBox .v{
  font-size:42px;font-weight:1000;letter-spacing:-1.2px;line-height:1;
  color: var(--adRed);
  text-shadow: 0 10px 22px rgba(239,68,68,.16);
}
@media (max-width:420px){ .todayPriceBox .v{font-size:40px;} }
.todayPriceBox .v.neg{color:#dc2626;}
.todayPriceBox .v.zero{color:#0284c7;}
.todayPriceBox .v.pos{color:#0f172a;text-shadow: 0 10px 22px rgba(15,23,42,.10);}

/* dots */
.todayDots{
  display:flex;
  justify-content:center;
  gap:6px;
  padding-top:8px;

/* =========================
   ✅ 공지: data.csv의 "__NOTICE__" 행에서 불러오기
   - CSV에 __NOTICE__ 행이 없으면 아래 기본값 사용(백업)
   ========================= */
const NOTICE_DEFAULT_VERSION  = "2026-02-01-01";
const NOTICE_DEFAULT_TITLE    = "KT 위약금 면제 13일 종료 !!!";
const NOTICE_DEFAULT_SUBTITLE = "해당 고객은 조건 확인이 필요합니다. 카톡에 “기종/통신사”만 보내주세요.";

// CSV 적용 결과(전역)
let NOTICE_ON = true;
let NOTICE_VERSION_CSV  = NOTICE_DEFAULT_VERSION;
let NOTICE_TITLE_CSV    = NOTICE_DEFAULT_TITLE;
let NOTICE_SUBTITLE_CSV = NOTICE_DEFAULT_SUBTITLE;
let NOTICE_TAGS_CSV     = NOTICE_DEFAULT_TAGS.slice();

function applyNoticeFromCSV(items){
  try{
    const row = items.find(x => String(x["기종"] ?? "").trim() === "__NOTICE__");
    if(!row) return items;

    const on = String(row["NOTICE_ON"] ?? "").trim();
    if(on !== "") NOTICE_ON = (on === "1" || on.toUpperCase() === "Y" || on.toUpperCase() === "O");

    const ver = String(row["NOTICE_VERSION"] ?? "").trim();
    if(ver) NOTICE_VERSION_CSV = ver;

    const t = String(row["NOTICE_TITLE"] ?? "").trim();
    if(t) NOTICE_TITLE_CSV = t;

    const sub = String(row["NOTICE_SUBTITLE"] ?? "").trim();
    if(sub) NOTICE_SUBTITLE_CSV = sub;

    const tagsRaw = String(row["NOTICE_TAGS"] ?? "").trim();
    if(tagsRaw){
      NOTICE_TAGS_CSV = tagsRaw.split("|").map(s=>s.trim()).filter(Boolean);
    }

    // ✅ 공지행은 목록/TODAY 후보에서 제거
    return items.filter(x => String(x["기종"] ?? "").trim() !== "__NOTICE__");
  }catch(e){
    return items;
  }
}

/* ✅ TODAY: 2시간 간격 */

    timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(new Date());
  const get = (t) => (parts.find(p => p.type === t)?.value || "");
  const y = get("year"), m = get("month"), d = get("day");
  return `TODAY_POPUP_BLOCKALL_${y}-${m}-${d}`;
}

/* ✅ 로테이션 키(날짜별) */

  }).formatToParts(new Date());

}

/* =========================
   ✅ StorageSafe
   ========================= */
const StorageSafe = (() => {
  const mem = new Map();
  function getStore(){
    try{
      const t="__t__";
      localStorage.setItem(t,"1");
      localStorage.removeItem(t);
      return localStorage;
    }catch(e){
      try{
        const t="__t__";
        sessionStorage.setItem(t,"1");
        sessionStorage.removeItem(t);
        return sessionStorage;
      }catch(e2){
        return null;
      }
    }
  }
  const store = getStore();
  return {
    get(key){
      try{ if(store) return store.getItem(key); }catch(e){}
      return mem.has(key) ? mem.get(key) : null;
    },
    set(key,val){
      try{ if(store) return store.setItem(key, String(val)); }catch(e){}
      mem.set(key, String(val));
    },
    remove(key){
      try{ if(store) return store.removeItem(key); }catch(e){}
      mem.delete(key);
    }
  };
})();

/* 업데이트 날짜/시간 자동 표시 (data.csv Last-Modified) */
async function setUpdateStamp(){

  try{
    const res = await fetch(`data.csv?v=${encodeURIComponent(CSV_VER)}`, { method: "HEAD", cache: "no-store" });
    const lm = res.headers.get("last-modified");
    if(!lm) return;
    const d = new Date(lm);
    const parts = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(d);
    const get = (t) => (parts.find(p => p.type === t)?.value || "");
    el.textContent = `${get("year")}.${get("month")}.${get("day")} ${get("hour")}:${get("minute")}`;
  }catch(e){}
}

(function adminRefreshToggle(){
  const hero = document.querySelector(".hero");
  const btn = document.getElementById("refreshBtn");
  if(!hero || !btn) return;

  let taps = 0;
  let timer = null;
  const reset = () => { taps = 0; if(timer){ clearTimeout(timer); timer = null; } };

  hero.addEventListener("click", () => {
    taps += 1;
    if(!timer){ timer = setTimeout(() => reset(), 2000); }
    if(taps >= 5){
      const hidden = (getComputedStyle(btn).display === "none");
      btn.style.display = hidden ? "inline-flex" : "none";
      reset();
    }
  }, { passive:true });

  btn.addEventListener("click", (e) => {

})();

/* 숫자 판단(색상용) */
const asNum = (x) => {
  const raw = String(x ?? "").replace(/\u2212/g, "-").replace(/,/g, "").trim();
  if (!raw) return null;
  const m = raw.match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  let n = Number(m[0]);
  if (!Number.isFinite(n)) return null;
  if (raw.includes("만원") || raw.includes("만")) n = n * 10000;
  return n;
};
const showVal = (raw) => {

}

/* CSV loader */
function parseCSVLine(line){
  const out = [];
  let cur = "";
  let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"'){
      if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
      else inQ = !inQ;
      continue;
    }
    if(ch === "," && !inQ){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}
async function fetchCSV(){
  const r = await fetch(`data.csv?v=${encodeURIComponent(CSV_VER)}`, { cache: "no-store" });
  if (!r.ok) throw new Error("data.csv 로드 실패");
  const t = await r.text();
  const lines = t.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  if (!lines.length) return [];
  const header = parseCSVLine(lines.shift()).map(s => String(s||"").trim());
  return lines.map(line => {
    const cols = parseCSVLine(line);
    const o = {};
    header.forEach((h,i)=> o[h] = String(cols[i] ?? "").trim());
    return o;
  });
}

/* ✅ SK/KT/LG 정렬 */
function buildCarrierSimple(items, carrier){
  const out = [];
  items.forEach(x=>{
    const model = String(x["기종"]||"").trim();
    if (!model) return;
    const mv = showVal(x[`${carrier}_이동`]);
    const ch = showVal(x[`${carrier}_기변`]);
    if (mv === "" && ch === "") return;

    const mvNum = asNum(mv);
    const chNum = asNum(ch);
    const nums = [mvNum, chNum].filter(v => v !== null);
    const bestNum = nums.length ? Math.min(...nums) : null;

    out.push({
      model, mv, ch, bestNum,
      infoText: infoLineWithPlan(carrier, x),
      discount: String(x["요금할인"]||"").trim().toUpperCase()==="O"
    });
  });

  out.sort((a,b)=>{
    const A=a.bestNum, B=b.bestNum;
    const group=(v)=> (v===null?3:(v<0?0:(v===0?1:2)));
    const gA=group(A), gB=group(B);
    if(gA!==gB) return gA-gB;
    if(A!==null && B!==null && A!==B) return A-B;
    return a.model.localeCompare(b.model,"ko");
  });

  return out;
}

/* =========================
   ✅ TODAY / NOTICE 팝업 로직
   - TODAY=1 있으면 TODAY 팝업
   - TODAY=1 없으면 공지 팝업(버전 기준: CSV)
   ========================= */
function isTodayRow(x){
  const v = String(x["TODAY"] ?? "").trim().toUpperCase();
  return v === "1" || v === "Y" || v === "O";
}
function safeHTML(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function getLastShownTs(){
  try{
    const v = Number(StorageSafe.get(POPUP_LAST_SHOWN_KEY) || 0);
    return Number.isFinite(v) ? v : 0;
  }catch(e){ return 0; }
}
function setLastShownTs(ts){
  try{ StorageSafe.set(POPUP_LAST_SHOWN_KEY, String(ts)); }catch(e){}
}

function makePickFromRow(row){
  if(!row) return null;
  const model = String(row["기종"]||"").trim();
  if(!model) return null;

  const candidates = [
    {carrier:"SK", move: showVal(row["SK_이동"]), change: showVal(row["SK_기변"])},
    {carrier:"KT", move: showVal(row["KT_이동"]), change: showVal(row["KT_기변"])},
    {carrier:"LG", move: showVal(row["LG_이동"]), change: showVal(row["LG_기변"])},
  ];

  const priced = candidates.map(c=>{
    const mvN = asNum(c.move);
    const chN = asNum(c.change);
    const best = [mvN, chN].filter(v=>v!==null);
    return { ...c, best: best.length ? Math.min(...best) : null };
  }).filter(c=> c.best !== null);

  if(!priced.length) return null;

  priced.sort((a,b)=> a.best - b.best);
  const bestCarrier = priced[0];

  const discount = String(row["요금할인"]||"").trim().toUpperCase()==="O";

  return {
    carrier: bestCarrier.carrier,
    model,
    move: bestCarrier.move,
    change: bestCarrier.change,
    infoText: infoLineWithPlan(bestCarrier.carrier, row),
    discount,
    best: bestCarrier.best
  };
}

/* ✅ TODAY 여러장: 순환 시작 인덱스 */
function getStartIndex(count){
  let idx = 0;
  try{ idx = Number(StorageSafe.get(getRotateKey()) || 0) || 0; }catch(e){ idx = 0; }
  const start = idx % Math.max(1, count);
  try{ StorageSafe.set(getRotateKey(), String(idx + 1)); }catch(e){}
  return start;
}

function shouldAnimatePrice(pick){
  const mvN = asNum(pick.move);
  const chN = asNum(pick.change);
  const has = [mvN, chN].filter(v=>v!==null);
  if(!has.length) return false;
  return Math.min(...has) <= 0;
}

  // ✅ 스크롤 초기 위치(시작 인덱스)
  requestAnimationFrame(() => {
    const item = track.querySelector(`.todayItem[data-index="${start}"]`);
    if(item) item.scrollIntoView({behavior:"instant", block:"nearest", inline:"center"});
  });

  // ✅ 물결 스케일(스크롤 중 줄었다가 스냅되면 복귀)
  function updateScaleAndDots(){
    const rect = track.getBoundingClientRect();
    const center = rect.left + rect.width/2;

    let bestIdx = 0;
    let bestDist = Infinity;

    track.querySelectorAll(".todayItem").forEach(el=>{
      const r = el.getBoundingClientRect();
      const c = r.left + r.width/2;
      const dist = Math.abs(c - center);

      const t = Math.min(1, dist / (rect.width/2));
      const scale = 1 - (0.04 * t);
      el.style.transform = `scale(${scale.toFixed(3)})`;

      if(dist < bestDist){ bestDist = dist; bestIdx = Number(el.dataset.index||0); }
    });

  const onScroll = () => {
    if(raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      updateScaleAndDots();
    });
  };
  track.addEventListener("scroll", onScroll, {passive:true});
  updateScaleAndDots();

  // ✅ 자동 슬라이드(여러장일 때만)
  let autoTimer = null;
  const startAuto = () => {
    if(picks.length <= 1) return;
    stopAuto();
    autoTimer = setInterval(() => {
      const activeDot = dots.querySelector(".todayDot.active");
      const cur = activeDot ? Number(activeDot.dataset.dot) : 0;
      const next = (cur + 1) % picks.length;
      const el = track.querySelector(`.todayItem[data-index="${next}"]`);
      if(el) el.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
    }, 4500);
  };
  const stopAuto = () => { if(autoTimer){ clearInterval(autoTimer); autoTimer=null; } };

  ["touchstart","mousedown"].forEach(ev=>{
    track.addEventListener(ev, () => stopAuto(), {passive:true});
  });
  ["touchend","mouseup","mouseleave"].forEach(ev=>{
    track.addEventListener(ev, () => startAuto(), {passive:true});
  });

  startAuto();

  const open = () => {
    backdrop.classList.add("show");
    modal.classList.add("show");
    backdrop.setAttribute("aria-hidden","false");
    modal.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
    setLastShownTs(Date.now());
  };

  const close = () => {
    try{
      if(noShowToday && noShowToday.checked){
        StorageSafe.set(getTodayBlockAllKey(), "1");
      }
    }catch(e){}
    stopAuto();
    backdrop.classList.remove("show");
    modal.classList.remove("show");
    backdrop.setAttribute("aria-hidden","true");
    modal.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  };

  if(!modal.dataset.bound){
    backdrop.addEventListener("click", () => {
      if(modal.classList.contains("show")) close();
      const n = document.getElementById("noticeModal");
      if(n && n.classList.contains("show")) closeNotice();
    });
    closeBtn.addEventListener("click", close);
    okBtn.addEventListener("click", close);
    document.addEventListener("keydown", (e)=>{
      if(e.key === "Escape"){
        if(modal.classList.contains("show")) close();
        const n = document.getElementById("noticeModal");
        if(n && n.classList.contains("show")) closeNotice();
      }
    });
    modal.dataset.bound = "1";
  }

  setTimeout(open, 260);
}

/* ✅ 공지 텍스트 자동 강조 */
function highlightNoticeTitle(s){
  const raw = String(s||"");
  let out = raw.replace(/(\d+)/g, `<span class="hlNum">$1</span>`);
  out = out.replace(/(종료|마감|마지막|오늘까지|D-\s?0|D-\s?1)/gi, `<span class="hlClose">$1</span>`);
  return out;
}

/* ✅ 공지 팝업: CSV 버전 기준 */
function shouldShowNoticeByVersion(){
  if(!NOTICE_ON) return false;
  const seen = String(StorageSafe.get(NOTICE_SEEN_VER_KEY) || "");
  if(seen === String(NOTICE_VERSION_CSV)) return false;
  return true;
}

function closeNotice(){
  const backdrop = document.getElementById("adBackdrop");
  const modal = document.getElementById("noticeModal");
  const noShow = document.getElementById("noticeNoShow");

  // 체크 시: 이번 버전 다시 안 봄(보조)
  try{
    if(noShow && noShow.checked){
      StorageSafe.set(NOTICE_SEEN_VER_KEY, String(NOTICE_VERSION_CSV));
    }
  }catch(e){}

  backdrop.classList.remove("show");
  modal.classList.remove("show");
  backdrop.setAttribute("aria-hidden","true");
  modal.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
}

function openNoticePopup(){
  const backdrop = document.getElementById("adBackdrop");
  const modal = document.getElementById("noticeModal");
  const banner = document.getElementById("noticeBanner");
  const closeBtn = document.getElementById("noticeCloseBtn");
  const okBtn = document.getElementById("noticeOkBtn");
  const noShow = document.getElementById("noticeNoShow");
  const kakaoBtn = document.getElementById("noticeKakaoBtn");
  if(!backdrop || !modal || !banner || !kakaoBtn) return;

  if(modal.classList.contains("show")) return;

  if(!shouldShowNoticeByVersion()) return;

  if(noShow) noShow.checked = false;
  kakaoBtn.href = KAKAO_URL;

  banner.classList.toggle("urgent", /종료|마감|D-\s?0|D-\s?1/.test(NOTICE_TITLE_CSV));

  banner.innerHTML = `
    <div class="noticeBadge">공지사항</div>
    <div class="noticeTitle">${highlightNoticeTitle(safeHTML(NOTICE_TITLE_CSV))}</div>
    <div class="noticeSub">${safeHTML(NOTICE_SUBTITLE_CSV)}</div>
    <div class="noticeTags">
      ${(NOTICE_TAGS_CSV||[]).map(t=>`<span class="noticeTag">${safeHTML(t)}</span>`).join("")}
    </div>
  `;

  const open = () => {
    backdrop.classList.add("show");
    modal.classList.add("show");
    backdrop.setAttribute("aria-hidden","false");
    modal.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";

    // ✅ 광고 느낌 방지: "한 번이라도 보여줬으면" 같은 버전은 다시 안 뜸
    try{
      StorageSafe.set(NOTICE_SEEN_VER_KEY, String(NOTICE_VERSION_CSV));
    }catch(e){}
  };

  if(!modal.dataset.bound){
    closeBtn.addEventListener("click", closeNotice);
    okBtn.addEventListener("click", closeNotice);
    modal.dataset.bound = "1";
  }

  setTimeout(open, 260);
}

/* ✅ 팝업 오케스트레이션:
   - TODAY 있으면 TODAY 먼저
   - TODAY 없으면 NOTICE
*/
async function openPopupSmart(){
  try{
    let items = (await fetchCSV()).filter(x => String(x["기종"] ?? "").trim() !== "");
    items = applyNoticeFromCSV(items);

    const hasToday = items.some(isTodayRow);
    if(hasToday){
      openTodayPopup();
      return;
    }
  }catch(e){
    // CSV 실패면 공지만 시도(기본값/기존 저장값 기준)
  }
  openNoticePopup();
}

/* ✅ 모바일/인앱 interval 씹힘 보강 */
(function popupRecheckOnResume(){
  let lastKick = 0;
  const kick = () => {
    const now = Date.now();
    if(now - lastKick < 1200) return;
    lastKick = now;
    openPopupSmart();
  };
  document.addEventListener("visibilitychange", () => { if(!document.hidden) kick(); });
  window.addEventListener("focus", () => kick());
})();

/* SW */
(async function(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const reg = await navigator.serviceWorker.register('./sw.js');

    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if(!sw) return;
      sw.addEventListener('statechange', () => {
        if(sw.state === 'installed' && navigator.serviceWorker.controller){
          sw.postMessage({ type: 'SKIP_WAITING' });
        }
      });
    });

    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(reloaded) return;
      reloaded = true;
      location.reload();
    });
  }catch(e){}
})();
</script>
