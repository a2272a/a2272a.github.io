<style>

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{

.wrap{max-width:760px;margin:0 auto;padding:14px 14px 100px;} /* ✅ 개선: 하단 여백 줄임 */

}

.updateWrap{display:flex;align-items:center;gap:14px;min-width:0;width:100%;}
.updateWrap .line1, .updateWrap .line2{

}
@media (max-width:480px){
  .updateWrap{flex-direction:column;align-items:flex-start;gap:2px;}
  .updateWrap .line1,.updateWrap .line2{font-size:16px;white-space:normal;}
}

.heroRefreshBtn{
  flex:0 0 auto; height:28px; padding:0 10px; border-radius:999px;
  border:1px solid rgba(0,255,180,.35); background:rgba(0,255,180,.10);

}
.heroRefreshBtn:active{transform:translateY(1px);filter:brightness(.98);}

/* ✅ 신규: 검색 & 필터 영역 */
.searchSection{

  background:#fff;
  border:1px solid var(--line);

}

/* tabs */
.tabs{display:flex;gap:8px;margin-top:12px;}

.subTabBtn.kt.active{ background:var(--kt); }

.list{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;}
@media (max-width: 420px){ .list{ grid-template-columns:1fr; } }

/* ✅ 개선: 카드에 즐겨찾기 버튼 추가 */
.card{

}

.titleRow{display:flex;justify-content:space-between;margin-bottom:8px;gap:10px;align-items:center;}
.model{font-weight:1000;font-size:18px;letter-spacing:-.2px;} /* ✅ 개선: 폰트 크기 증가 */
.badge{font-size:12px;font-weight:1000;padding:6px 10px;border-radius:999px;color:#fff;white-space:nowrap;}
.badge.sk{background:var(--sk);} .badge.kt{background:var(--kt);} .badge.lg{background:var(--lg);}
.badge.hot{background:var(--hot);} .badge.low{background:var(--low);}

/* ✅ 신규: 용어 설명 툴팁 */
.infoLine{font-size:12px;font-weight:1000;color:var(--muted);margin:0 0 6px; line-height:1.25;}
.helpIcon{

  height:16px;

}
.helpIcon:hover::after{
  content:attr(data-tooltip);

  bottom:120%;
  left:50%;
  transform:translateX(-50%);
  padding:8px 12px;
  background:#1f2937;
  color:#fff;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;

  z-index:100;

}

.subHint{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:1000;}

.discountPill{
  display:inline-flex; align-items:center; gap:6px;
  margin: 2px 0 8px; padding:6px 10px; border-radius:999px;
  font-size:12px; font-weight:1000;

  border:1px solid rgba(37,99,235,.22); line-height:1;
}
.discountPill strong{font-weight:1000;}

/* price row */
.priceRow{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
}
.priceRow.one{ grid-template-columns:1fr; }

.pill{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fafafa;min-width:0;}
.pill .k{font-size:12px;color:var(--muted);font-weight:1000;margin-bottom:4px;}
.pill .v{font-size:22px;font-weight:1000;letter-spacing:-.4px;} /* ✅ 개선: 폰트 크기 증가 */
.neg{color:#dc2626;} .zero{color:#0ea5e9;} .pos{color:#0f172a;}

.loading{grid-column:1/-1;padding:18px;text-align:center;font-weight:1000;color:#64748b;}

/* ✅ 신규: 비교 모드 카드 스타일 */
.compareCard{

}

}

}
@media (max-width: 480px){

}
.carrierCompare{

}

}
.carrierCompare .price{

}

}
.carrierCompare.best{

}
.carrierCompare.best::after{

}

/* addon */
.addonCard{
  grid-column:1/-1; padding:14px; border-radius:14px;

}
.addonHead{

}
.addonTitle{font-size:16px;font-weight:1000;letter-spacing:-.2px;color:#0f172a;}
.addonPill{font-size:13px;font-weight:1000;padding:7px 11px;border-radius:999px;color:#fff;white-space:nowrap;}
.addonPill.sk{background:var(--sk);} .addonPill.kt{background:var(--kt);} .addonPill.lg{background:var(--lg);}

.addonChevron{
  flex:0 0 auto; width:36px;height:36px;

}
.addonChevron svg{

}
.addonCard.open .addonChevron svg{ transform: rotate(180deg); }

.addonBody{margin-top:10px;display:none;}
.addonBody.show{display:block;}
.addonList{margin:0;padding-left:18px;}
.addonList li{margin:10px 0;font-size:15px;font-weight:1000;color:#0f172a;line-height:1.25;}
.addonList .sub{margin-top:4px;font-size:14px;font-weight:1000;color:var(--muted);}

/* ✅ 개선: 하단 독 최적화 */
.bottomDock{
  position:fixed;
  left:12px;right:12px;
  bottom:calc(10px + env(safe-area-inset-bottom));

  box-shadow:0 14px 34px rgba(15,23,42,.14);

  transition: height .2s;
}
.bottomDock.expanded{

}

.dockBtn{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px; /* ✅ 개선: 간격 줄임 */
  border-radius:14px;
  text-decoration:none;
  font-weight:1000;
  font-size:14px; /* ✅ 개선: 폰트 크기 조정 */
  letter-spacing:-.2px;
  border:1px solid rgba(15,23,42,.10);

  color:#0f172a;
  box-shadow:0 8px 18px rgba(15,23,42,.08);

.dockBtn:active{transform: translateY(1px);box-shadow:0 6px 14px rgba(15,23,42,.10);filter: brightness(.98);}
.dockBtn svg{width:18px;height:18px;stroke: currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.dockBtn.call{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.22);color:#0b3a22;}
.dockBtn.sms{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.22);color:#083244;}
.dockBtn.kakao{background:rgba(254,229,0,.35);border-color:rgba(254,229,0,.55);color:#3b2f00;}
.dockBtn.compare{background:rgba(147,51,234,.12);border-color:rgba(147,51,234,.22);color:#5b21b6;}
.dockBtn span{ line-height:1; }

/* ✅ 신규: 비교함 배지 */
.compareBadge{
  position:absolute;
  top:-6px;
  right:-6px;
  width:20px;
  height:20px;
  border-radius:999px;
  background:#ef4444;

  font-size:11px;
  font-weight:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(239,68,68,.4);
}

/* ✅ 신규: 비교함 드로어 */
.compareDrawer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-height:70vh;
  background:#fff;
  border-radius:24px 24px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.2);

.compareDrawer.show{

}
.compareDrawer h3{

}
.compareList{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:16px;
}
.compareItem{

/* ✅ 신규: 초기 방문자 가이드 */
.guideTooltip{

  bottom:90px;
  right:20px;
  max-width:280px;
  padding:16px;
  background:#1f2937;
  color:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  z-index:1000;
  animation: slideUp .3s ease;

}
.guideTooltip.show{
  display:block;
}
.guideTooltip::after{
  content:"";
  position:absolute;
  bottom:-8px;
  right:30px;
  width:0;
  height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-top:8px solid #1f2937;
}
.guideTooltip h4{

}
.guideTooltip p{

  line-height:1.5;
  opacity:.9;
}
.guideTooltip button{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#3b82f6;
  color:#fff;
  font-weight:1000;
  cursor:pointer;
}
.guideTooltip .closeGuide{

  border:1px solid rgba(255,255,255,.3);
  margin-top:6px;
}

@keyframes slideUp{
  from{ transform:translateY(20px); opacity:0; }
  to{ transform:translateY(0); opacity:1; }
}

  if (c === "KT") return `이동: KT 110요금 6개월<br>기변: KT 110요금 6개월<span class="subHint">부가서비스 유지조건 클릭</span>`;
  return `이동: LG 115요금 6개월<br>기변: LG 115요금 6개월<span class="subHint">부가서비스 유지조건 클릭</span>`;
};
const infoLineWithPlan = (c, row) => {
  const moveRaw   = row?.[`${c}_요금제`];
  const chgRaw    = row?.[`${c}_요금제.1`];
  const movePlan  = onlyDigits(moveRaw);
  const changePlan= onlyDigits(chgRaw);
  if(!movePlan && !changePlan) return fixedInfoLine(c);
  const m = movePlan || changePlan;
  const k = changePlan || movePlan;
  return `이동: ${esc(c)} ${esc(m)}요금 6개월 <span class="helpIcon" data-tooltip="다른 통신사에서 번호 이동">ℹ️</span><br>기변: ${esc(c)} ${esc(k)}요금 6개월 <span class="helpIcon" data-tooltip="같은 통신사에서 폰만 교체">ℹ️</span><span class="subHint">부가서비스 유지조건 클릭</span>`;
};

// ✅ 신규: 즐겨찾기 토글
function toggleFavorite(model, carrier, move, change){
  const item = { model, carrier, move, change };
  const idx = favorites.findIndex(f => f.model === model && f.carrier === carrier);
  
  if(idx >= 0){
    favorites.splice(idx, 1);
  }else{
    if(favorites.length >= 5){
      alert("최대 5개까지만 비교할 수 있습니다.");
      return false;
    }
    favorites.push(item);
  }
  
  localStorage.setItem("favorites", JSON.stringify(favorites));
  updateCompareBadge();
  updateCompareDrawer();
  return idx < 0; // 추가되었으면 true
}

function isFavorited(model, carrier){
  return favorites.some(f => f.model === model && f.carrier === carrier);
}

function updateCompareBadge(){
  const badge = document.getElementById("compareBadge");
  if(favorites.length > 0){
    badge.textContent = favorites.length;
    badge.style.display = "flex";
  }else{
    badge.style.display = "none";
  }
}

function updateCompareDrawer(){
  const compareList = document.getElementById("compareList");
  const compareCount = document.getElementById("compareCount");
  compareCount.textContent = favorites.length;
  
  if(favorites.length === 0){
    compareList.innerHTML = '<div class="loading">선택한 상품이 없습니다</div>';
    return;
  }
  
  compareList.innerHTML = favorites.map((item, idx) => `
    <div class="compareItem">
      <div>
        <strong>${esc(item.model)}</strong> - ${esc(item.carrier)}
        <div style="font-size:13px;color:var(--muted);margin-top:4px;">
          이동: ${esc(item.move)} / 기변: ${esc(item.change)}
        </div>
      </div>
      <button onclick="removeFavorite(${idx})" aria-label="삭제">×</button>
    </div>
  `).join("");
}

function removeFavorite(idx){
  favorites.splice(idx, 1);
  localStorage.setItem("favorites", JSON.stringify(favorites));
  updateCompareBadge();
  updateCompareDrawer();
  
  // 현재 화면 갱신
  if(mode === "PHONE" && window.__CSV_ROWS__){
    if(viewMode === "single"){
      renderPhone(window.__CSV_ROWS__, lastPhoneTab);
    }else{
      renderPhoneCompare(window.__CSV_ROWS__);
    }
  }
}

function addAddonCard(carrier){
  const items = ADDON[carrier] || [];
  const pillClass = carrier === "SK" ? "sk" : (carrier === "KT" ? "kt" : "lg");
  const id = `addon_${carrier}`;
  const lis = items.map(x => `
    <li>
      ${esc(x.t)}
      <div class="sub">${esc(x.d)}</div>
    </li>
  `).join("");

  list.insertAdjacentHTML("beforeend", `
    <div class="card addonCard" id="${id}">
      <div class="addonHead" role="button" tabindex="0" aria-expanded="false">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;">
          <span class="addonPill ${pillClass}">${esc(carrier)}</span>
          <span class="addonTitle">부가서비스 유지 조건</span>
        </div>
        <span class="addonChevron" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </span>
      </div>
      <div class="addonBody">
        <ol class="addonList">${lis}</ol>
      </div>
    </div>
  `);

  const root = document.getElementById(id);
  const head = root.querySelector(".addonHead");
  const body = root.querySelector(".addonBody");

  const toggle = () => {
    const open = body.classList.toggle("show");
    head.setAttribute("aria-expanded", open ? "true" : "false");
    root.classList.toggle("open", open);
  };

  head.addEventListener("click", (e)=>{ e.preventDefault(); toggle(); });
  head.addEventListener("keydown", (e)=>{
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });
}

function isDiscountRow(x){
  const v = String(x["요금할인"] ?? "").trim().toLowerCase();
  return (v === "o" || v === "1" || v === "true" || v === "y" || v === "yes" || v === "on");
}

function addPhoneCard({badgeText, badgeClass, model, move, change, infoText, discount, carrier, row}){
  const mv = (move ?? "");
  const ch = (change ?? "");
  const mvNum = asNum(mv);
  const chNum = asNum(ch);
  const hasMove = (mv !== "");
  const hasChange = (ch !== "");
  const rowClass = (hasMove && hasChange) ? "" : "one";
  
  const favorited = carrier ? isFavorited(model, carrier) : false;
  const heartIcon = favorited ? "❤️" : "🤍";
  const heartClass = favorited ? "active" : "";

  const cardId = `card_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

  list.insertAdjacentHTML("beforeend", `
    <div class="card" id="${cardId}" data-model="${esc(model)}" data-carrier="${esc(carrier || '')}" data-move="${esc(mv)}" data-change="${esc(ch)}" data-discount="${discount ? '1' : '0'}">
      ${carrier ? `<button class="favoriteBtn ${heartClass}" onclick="handleFavorite('${cardId}')" aria-label="즐겨찾기">${heartIcon}</button>` : ''}
      
      <div class="titleRow">
        <div class="model">${esc(model)}</div>
        <div class="badge ${badgeClass}">${esc(badgeText)}</div>
      </div>

      ${infoText ? `<p class="infoLine">${infoText}</p>` : ``}
      ${discount ? `<div class="discountPill">요금할인 <strong>25%</strong></div>` : ``}

      <div class="priceRow ${rowClass}">
        ${hasMove ? `
          <div class="pill">
            <div class="k">${mode==="INTERNET" ? "월요금" : (mode==="MVNO" ? "월요금" : "이동")}</div>
            <div class="v ${vClass(mvNum)}">${esc(mv)}</div>
          </div>` : ``}
        ${hasChange ? `
          <div class="pill">
            <div class="k">${mode==="INTERNET" ? "결합" : "기변"}</div>
            <div class="v ${vClass(chNum)}">${esc(ch)}</div>
          </div>` : ``}
      </div>
    </div>
  `);
  
  // ✅ 신규: 롱프레스로 상담 요청
  if(carrier){
    const card = document.getElementById(cardId);
    let pressTimer;
    card.addEventListener("touchstart", (e) => {
      if(e.target.closest(".favoriteBtn")) return;
      pressTimer = setTimeout(() => {
        const text = `${model} (${carrier}) 상담 요청\n이동: ${mv} / 기변: ${ch}`;
        window.location.href = `https://open.kakao.com/o/s729bI5h?text=${encodeURIComponent(text)}`;
      }, 800);
    });
    card.addEventListener("touchend", () => clearTimeout(pressTimer));
    card.addEventListener("touchmove", () => clearTimeout(pressTimer));
  }
}

window.handleFavorite = function(cardId){
  const card = document.getElementById(cardId);
  const model = card.dataset.model;
  const carrier = card.dataset.carrier;
  const move = card.dataset.move;
  const change = card.dataset.change;
  
  const added = toggleFavorite(model, carrier, move, change);
  const btn = card.querySelector(".favoriteBtn");
  
  if(added){
    btn.textContent = "❤️";
    btn.classList.add("active");
  }else{
    btn.textContent = "🤍";
    btn.classList.remove("active");
  }
};

function parseCSVLine(line){
  const out = [];
  let cur = "";
  let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"'){
      if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
      else inQ = !inQ;
      continue;
    }
    if(ch === "," && !inQ){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}

function makeUniqueHeader(rawHeader){
  const seen = Object.create(null);
  return rawHeader.map(h=>{
    const key = String(h||"").trim();
    if(!seen[key]){
      seen[key] = 1;
      return key;
    }
    const idx = seen[key];
    seen[key] = idx + 1;
    return `${key}.${idx}`;
  });
}

async function fetchCSV(extraBust=""){
  const url = `data.csv?v=${encodeURIComponent(CSV_VER)}${extraBust ? `&b=${extraBust}` : ""}`;
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("data.csv 로드 실패");
  const t = await r.text();
  const lines = t.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  if (!lines.length) return [];

  const rawHeader = parseCSVLine(lines.shift());
  const header = makeUniqueHeader(rawHeader);

  return lines.map(line => {
    const cols = parseCSVLine(line);
    const o = {};
    header.forEach((h,i)=> o[h] = String(cols[i] ?? "").trim());
    return o;
  });
}

function getRowBestPrice(row, carrier){
  const mv = asNum(row[`${carrier}_이동`]);
  const ch = asNum(row[`${carrier}_기변`]);
  if(mv === null && ch === null) return Number.POSITIVE_INFINITY;
  if(mv === null) return ch;
  if(ch === null) return mv;
  return Math.min(mv, ch);
}

// ✅ 개선: 통신사별 보기
function renderPhone(rows, carrier){
  clearList();
  addAddonCard(carrier);

  const filtered = rows
    .filter(r => {
      const type = String(r["기종"] ?? "").trim();
      if (type === "__NOTICE__") {
        return !(window.__NOTICE_OFF__ && window.__NOTICE_OFF__());
      }
      const mv = showVal(r[`${carrier}_이동`]);
      const ch = showVal(r[`${carrier}_기변`]);
      return (mv !== "" || ch !== "");
    })
    .sort((a,b)=> (getRowBestPrice(a, carrier) - getRowBestPrice(b, carrier)));

  if(!filtered.length){
    list.insertAdjacentHTML("beforeend", `<div class="loading">표시할 카드가 없습니다.</div>`);
    return;
  }

  filtered.forEach(r=>{
    const model = String(r["기종"] ?? "").trim() || "-";
    const move = showVal(r[`${carrier}_이동`]);
    const change = showVal(r[`${carrier}_기변`]);
    const discount = isDiscountRow(r);

    addPhoneCard({
      badgeText: carrier,
      badgeClass: carrier === "SK" ? "sk" : carrier === "KT" ? "kt" : "lg",
      model,
      move,
      change,
      infoText: infoLineWithPlan(carrier, r),
      discount,
      carrier,
      row: r
    });
  });
}

// ✅ 신규: 가격 비교 모드
function renderPhoneCompare(rows){
  clearList();

  const filtered = rows.filter(r => {
    const type = String(r["기종"] ?? "").trim();
    if (type === "__NOTICE__") return false;
    
    const skMv = showVal(r["SK_이동"]);
    const skCh = showVal(r["SK_기변"]);
    const ktMv = showVal(r["KT_이동"]);
    const ktCh = showVal(r["KT_기변"]);
    const lgMv = showVal(r["LG_이동"]);
    const lgCh = showVal(r["LG_기변"]);
    
    return (skMv || skCh || ktMv || ktCh || lgMv || lgCh);
  });

  if(!filtered.length){
    list.insertAdjacentHTML("beforeend", `<div class="loading">표시할 카드가 없습니다.</div>`);
    return;
  }

  filtered.forEach(r => {
    const model = String(r["기종"] ?? "").trim() || "-";
    
    const carriers = [
      { name: "SK", move: r["SK_이동"], change: r["SK_기변"], class: "sk" },
      { name: "KT", move: r["KT_이동"], change: r["KT_기변"], class: "kt" },
      { name: "LG", move: r["LG_이동"], change: r["LG_기변"], class: "lg" }
    ];
    
    const prices = carriers.map(c => {
      const mv = asNum(c.move);
      const ch = asNum(c.change);
      if(mv === null && ch === null) return { carrier: c.name, price: null, text: "-", class: c.class };
      const best = (mv === null) ? ch : (ch === null ? mv : Math.min(mv, ch));
      return { carrier: c.name, price: best, text: fmtWon(best) + "원", class: c.class };
    }).filter(p => p.price !== null);
    
    if(prices.length === 0) return;
    
    prices.sort((a, b) => a.price - b.price);
    const minPrice = prices[0].price;
    
    const compareHtml = prices.map(p => {
      const diff = p.price - minPrice;
      const isBest = diff === 0;
      return `
        <div class="carrierCompare ${isBest ? 'best' : ''}">
          <span class="badge ${p.class}">${esc(p.carrier)}</span>
          <span class="price">${esc(p.text)}</span>
          ${!isBest && diff > 0 ? `<span class="priceDiff">(+${fmtWon(diff)}원)</span>` : ''}
        </div>
      `;
    }).join("");
    
    list.insertAdjacentHTML("beforeend", `
      <div class="card compareCard">
        <div class="model">${esc(model)}</div>
        <div class="priceCompare">
          ${compareHtml}
        </div>
      </div>
    `);
  });
}

document.getElementById("quickFilters").addEventListener("click", (e) => {
  const btn = e.target.closest(".filterChip");
  if(!btn) return;
  
  // 필터 버튼 활성화
  document.querySelectorAll(".filterChip").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  
  const filter = btn.dataset.filter;
  
  document.querySelectorAll(".card:not(.addonCard)").forEach(card => {
    if(filter === "all"){
      card.style.display = "";
      return;
    }
    
    const model = card.querySelector(".model")?.textContent.toLowerCase() || "";
    const discount = card.dataset.discount === "1";
    const priceText = card.querySelector(".pill .v")?.textContent || "";
    const price = asNum(priceText);
    
    let show = true;
    
    if(filter === "samsung"){
      show = model.includes("갤럭시") || model.includes("galaxy");
    }else if(filter === "apple"){
      show = model.includes("아이폰") || model.includes("iphone");
    }else if(filter === "under50"){
      show = price !== null && price <= 500000;
    }else if(filter === "discount"){
      show = discount;
    }
    
    card.style.display = show ? "" : "none";
  });
});

  if(mode !== "PHONE") return;
  
  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;
  
  const diffX = touchStartX - touchEndX;
  const diffY = Math.abs(touchStartY - touchEndY);
  
  // 세로 스크롤이 아닌 가로 스와이프만 감지
  if(Math.abs(diffX) > 100 && diffY < 50){
    const tabs = ["SK", "KT", "LG"];
    const currentIdx = tabs.indexOf(lastPhoneTab);
    
    let nextIdx;
    if(diffX > 0){ // 왼쪽으로 스와이프
      nextIdx = (currentIdx + 1) % tabs.length;
    }else{ // 오른쪽으로 스와이프
      nextIdx = (currentIdx - 1 + tabs.length) % tabs.length;
    }
    
    const nextTab = tabs[nextIdx];
    activatePhoneTab(nextTab);
    
    if(window.__CSV_ROWS__){
      if(viewMode === "single"){
        renderPhone(window.__CSV_ROWS__, nextTab);
      }else{
        renderPhoneCompare(window.__CSV_ROWS__);
      }
    }
  }
});

async function setUpdateStamp(){
  const el = document.getElementById("updateStamp");
  if(!el) return;
  try{
    const res = await fetch(`data.csv?v=${encodeURIComponent(CSV_VER)}`, { method: "HEAD", cache: "no-store" });
    const lm = res.headers.get("last-modified");
    if(!lm) return;
    const d = new Date(lm);
    const parts = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(d);
    const get = (t) => (parts.find(p => p.type === t)?.value || "");
    el.textContent = `${get("year")}.${get("month")}.${get("day")} ${get("hour")}:${get("minute")}`;
  }catch(e){}
}

(function adminButtonsInit(){
  const hero = document.querySelector(".hero");
  const refreshBtn = document.getElementById("refreshBtn");
  const noticeBtn = document.getElementById("noticeAdminToggleBtn");
  if(!hero || !refreshBtn || !noticeBtn) return;

  let tap = 0;
  let tmr = null;

  const KEY_NOTICE_OFF = "NOTICE_OFF";
  const readNoticeOff = () => localStorage.getItem(KEY_NOTICE_OFF) === "1";
  const setNoticeOff = (v) => localStorage.setItem(KEY_NOTICE_OFF, v ? "1" : "0");

  const applyNoticeBtnUI = () => {
    const off = readNoticeOff();
    noticeBtn.textContent = off ? "공지ON" : "공지OFF";
  };

  window.__NOTICE_OFF__ = readNoticeOff;

  hero.addEventListener("click", ()=>{
    tap++;
    clearTimeout(tmr);
    tmr = setTimeout(()=> tap = 0, 1200);
    if(tap >= 5){
      tap = 0;
      const now = refreshBtn.style.display === "inline-flex" ? "none" : "inline-flex";
      refreshBtn.style.display = now;
      noticeBtn.style.display  = now;
      applyNoticeBtnUI();
    }
  });

  function rerenderByMode(){
    if(mode === "PHONE") {
      if(window.__CSV_ROWS__){
        if(viewMode === "single"){
          renderPhone(window.__CSV_ROWS__, lastPhoneTab);
        }else{
          renderPhoneCompare(window.__CSV_ROWS__);
        }
      }
      return;
    }
    if(mode === "MVNO") { renderMVNO(null, mvnoNet); return; }
    if(mode === "INTERNET") { renderINTERNET(null, inetCarrier); return; }
  }

  refreshBtn.addEventListener("click", async ()=>{
    try{
      showLoading("강력 새로고침 중…");
      const bust = String(Date.now());
      const rows = await fetchCSV(bust);
      window.__CSV_ROWS__ = rows;
      await setUpdateStamp();
      rerenderByMode();
    }catch(e){
      console.error(e);
      showLoading("새로고침 실패: data.csv 확인 필요");
    }
  });

  noticeBtn.addEventListener("click", ()=>{
    const next = !readNoticeOff();
    setNoticeOff(next);
    applyNoticeBtnUI();
    rerenderByMode();
  });

  applyNoticeBtnUI();
})();

(function inetPopupInit(){
  const popup = document.getElementById("inetPopup");
  const btnClose = document.getElementById("inetPopClose");
  const chk = document.getElementById("inetHide24");
  if(!popup || !btnClose || !chk) return;

  const KEY = "INET_POPUP_HIDE_UNTIL";
  const readUntil = () => Number(localStorage.getItem(KEY) || "0");

  const open = () => {
    popup.classList.add("show");
    popup.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  };
  const close = () => {
    popup.classList.remove("show");
    popup.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  };

  const until = readUntil();
  if(Date.now() >= until){
    open();
  }

  btnClose.addEventListener("click", ()=>{
    if(chk.checked){
      localStorage.setItem(KEY, String(Date.now() + 24*60*60*1000));
    }else{
      localStorage.removeItem(KEY);
    }
    close();
  });

  popup.addEventListener("click", (e)=>{
    if(e.target === popup){
      if(chk.checked){
        localStorage.setItem(KEY, String(Date.now() + 24*60*60*1000));
      }else{
        localStorage.removeItem(KEY);
      }
      close();
    }
  });

  window.addEventListener("keydown", (e)=>{
    if(e.key === "Escape" && popup.classList.contains("show")){
      if(chk.checked){
        localStorage.setItem(KEY, String(Date.now() + 24*60*60*1000));
      }else{
        localStorage.removeItem(KEY);
      }
      close();
    }
  });
})();

(async function init(){
  showLoading("data.csv 불러오는 중…");
  await setUpdateStamp();

  try{
    const rows = await fetchCSV();
    window.__CSV_ROWS__ = rows;

    mode = "PHONE";
    setServiceActive(null);
    hideAllSubTabs();
    showSearchSection(true);
    activatePhoneTab(lastPhoneTab);
    renderPhone(rows, lastPhoneTab);

    activateMvnoNet(mvnoNet);
    activateInetCarrier(inetCarrier);
    
    updateCompareBadge();
    showGuide();

  }catch(err){
    console.error(err);
    showLoading("data.csv를 불러오지 못했습니다. 파일명/경로를 확인해주세요.");
  }
})();
