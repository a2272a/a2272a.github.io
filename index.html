<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e5e7eb;
  --sk:#2563eb; --kt:#111827; --lg:#16a34a; --hot:#f97316; --low:#7c3aed;
  --call:#22c55e; --sms:#38bdf8; --kakao:#fee500;

  --ledBg:#070b12; --ledBg2:#0b1220; --ledBorder:rgba(255,255,255,.14);
  --ledText:#f8fffc;

  /* ✅ 팝업(홈쇼핑 밝은 스타일) */
  --adBg1:#fff7e6;
  --adBg2:#ffffff;
  --adBorder:rgba(245,158,11,.55);

}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 190px;}

/* hero */
.hero{
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(900px 160px at 50% 0%, rgba(0,255,180,.10), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.05) 0%, rgba(0,0,0,.22) 100%),
    linear-gradient(90deg, var(--ledBg) 0%, var(--ledBg2) 50%, var(--ledBg) 100%);
  border:1px solid var(--ledBorder);
  box-shadow:0 14px 34px rgba(0,0,0,.18), 0 0 0 2px rgba(255,255,255,.10);
}
.heroMarquee2{min-height:52px;display:flex;align-items:center;padding:10px 12px;position:relative;}
.heroMarquee2::before{
  content:"";position:absolute; inset:0;
  background: radial-gradient(circle, rgba(255,255,255,.08) 1px, transparent 1.9px);
  background-size: 8px 8px;opacity:.22;pointer-events:none;
}
.marqueeLine{
  width:100%;
  height:auto;
  display:flex;align-items:center;justify-content:space-between;overflow:hidden;
  padding:6px 10px;border-radius:14px;background: rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.10);box-shadow: inset 0 12px 20px rgba(0,0,0,.34);
  gap:10px;
}
.marqueeInner{display:flex;align-items:center;min-width:0;flex:1;}

/* 업데이트 문구 */
.updateWrap{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  width:100%;
}
.updateWrap .line1,
.updateWrap .line2{
  font-size:18px;
  font-weight:1000;
  letter-spacing:-.6px;
  color:var(--ledText);
  text-shadow:0 0 12px rgba(0,255,180,.70), 0 0 26px rgba(0,255,180,.40), 0 2px 14px rgba(0,0,0,.85);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}
@media (max-width:480px){
  .updateWrap{flex-direction:column;align-items:flex-start;gap:2px;}
  .updateWrap .line1,.updateWrap .line2{font-size:16px;white-space:normal;}
}

/* 관리자 버튼(기본 숨김) */
.heroRefreshBtn{
  flex:0 0 auto;
  height:28px;

/* tabs */
.tabs{display:flex;gap:8px;margin-top:12px;}

.tabBtn.kt.active{background:var(--kt);}
.tabBtn.lg.active{background:var(--lg);}

.tabBtn.svc.mvno.active{background:var(--lg);}
.tabBtn.svc.internet.active{background:var(--kt);}

.panel{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;}

/* sub tabs */
.subTabs{display:none;gap:8px;margin:0 0 12px;}
.subTabs.show{ display:flex; }
.subTabBtn{

  background:#fff;font-weight:1000;font-size:14px;cursor:pointer;
}
.subTabBtn.active{ color:#fff; border-color:transparent; }
.subTabBtn.sk.active{ background:var(--sk); }
.subTabBtn.kt.active{ background:var(--kt); }
.subTabBtn.lg.active{ background:var(--lg); }

.list{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;}
@media (max-width: 420px){ .list{ grid-template-columns:1fr; } }

.card{border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
.titleRow{display:flex;justify-content:space-between;margin-bottom:8px;gap:10px;align-items:center;}
.model{font-weight:1000;font-size:16px;letter-spacing:-.2px;}

.badge.sk{background:var(--sk);} .badge.kt{background:var(--kt);} .badge.lg{background:var(--lg);}
.badge.hot{background:var(--hot);} .badge.low{background:var(--low);}

/* ✅ B안: 모델 아래 작은 알약 배지 (요금할인) */

}

/* ✅ 초강력 CTA: “부가서비스 유지조건” 클릭 유도 */
.addonCta{

  margin:10px 0 10px;

  border-radius:14px;

    linear-gradient(90deg, rgba(239,68,68,.14), rgba(251,146,60,.14)),

  font-weight:1000;
  font-size:14px;

}
.addonCta strong{font-weight:1000;}
.addonCta .arr{

  border-radius:12px;

  color:#fff;
  box-shadow:0 14px 22px rgba(239,68,68,.20);
}
@keyframes ctaPulse{
  0%,100%{ transform: translateY(0); filter:brightness(1); }
  50%{ transform: translateY(-1px); filter:brightness(1.02); }
}
.addonCta{ animation: ctaPulse .9s ease-in-out infinite; }
.addonCta:active{ transform: translateY(1px); animation:none; }

/* price row */
.priceRow{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
}
.priceRow.one{ grid-template-columns:1fr; }

.pill{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fafafa;min-width:0;}
.pill .k{font-size:12px;color:var(--muted);font-weight:1000;margin-bottom:4px;}
.pill .v{font-size:20px;font-weight:1000;letter-spacing:-.4px;}
.neg{color:#dc2626;} .zero{color:#0ea5e9;} .pos{color:#0f172a;}

.planLine{font-size:13px;font-weight:1000;letter-spacing:-.2px;margin:0 0 8px;color:#0f172a;line-height:1.25;}
.moneyRow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.moneyRow .label{font-size:12px;font-weight:1000;color:var(--muted);}
.moneyRow .val{font-size:22px;font-weight:1000;letter-spacing:-.4px;color:#0f172a;}
.moneyRow .val2{font-size:19px;font-weight:1000;letter-spacing:-.4px;color:#0f172a;}

.loading{grid-column:1/-1;padding:18px;text-align:center;font-weight:1000;color:#64748b;}

/* notice card */
.noticeCard{
  grid-column:1/-1;
  padding:10px 12px;
  border-radius:14px;
  background: linear-gradient(180deg, rgba(15,23,42,.04), rgba(15,23,42,.02));
}
.noticeCard .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.noticeCard .twrap{display:flex;flex-direction:column;gap:4px;}
.noticeCard .t1{font-size:13px;font-weight:1000;letter-spacing:-.2px;color:#0f172a;line-height:1.2;}
.noticeCard .t2{font-size:12px;font-weight:1000;letter-spacing:-.2px;color:var(--muted);line-height:1.2;}
.noticeCard a{
  flex:0 0 auto;
  text-decoration:none;font-weight:1000;font-size:13px;padding:8px 10px;border-radius:12px;
  background:rgba(254,229,0,.35);border:1px solid rgba(254,229,0,.55);color:#3b2f00;
}

/* bottom dock */
.bottomDock{
  position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));
  height:60px;padding:8px;display:flex;gap:10px;border-radius:18px;
  background:rgba(255,255,255,.88);border:1px solid rgba(15,23,42,.10);
  box-shadow:0 14px 34px rgba(15,23,42,.14);backdrop-filter: blur(10px) saturate(160%);
  z-index:999;
}
.dockBtn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;
  text-decoration:none;font-weight:1000;font-size:16px;letter-spacing:-.2px;
  border:1px solid rgba(15,23,42,.10);background:#fff;color:#0f172a;
  box-shadow:0 8px 18px rgba(15,23,42,.08);
}
.dockBtn:active{transform: translateY(1px);box-shadow:0 6px 14px rgba(15,23,42,.10);filter: brightness(.98);}
.dockBtn svg{width:20px;height:20px;stroke: currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.dockBtn.call{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.22);color:#0b3a22;}
.dockBtn.sms{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.22);color:#083244;}
.dockBtn.kakao{background:rgba(254,229,0,.35);border-color:rgba(254,229,0,.55);color:#3b2f00;}

/* =========================
   ✅ 공용 팝업 베이스
   ========================= */
.adBackdrop{
  position:fixed; inset:0;
  background: rgba(15,23,42,.45);
  opacity:0; pointer-events:none;
  transition: opacity .18s ease;
  z-index:2000;
}
.adModal{
  position:fixed; inset:0;
  display:flex; align-items:flex-end; justify-content:center;
  padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
  opacity:0; pointer-events:none;
  transition: opacity .18s ease;
  z-index:2001;
}
.adModal.show, .adBackdrop.show{ opacity:1; pointer-events:auto; }

.adSheet{
  width:min(720px, 100%);
  border-radius:22px;
  overflow:hidden;
  border:2px solid var(--adBorder);
  box-shadow:
    0 24px 70px rgba(15,23,42,.30),
    0 0 0 3px rgba(255,255,255,.85),
    0 0 34px var(--adGlow2);
  background:
    radial-gradient(900px 240px at 50% 0%, rgba(245,158,11,.18), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.86) 100%),
    linear-gradient(90deg, var(--adBg1) 0%, var(--adBg2) 50%, var(--adBg1) 100%);
  transform: translateY(16px);
  transition: transform .22s ease;
}
.adModal.show .adSheet{ transform: translateY(0); }

.adTopBar{
  padding:12px 14px 10px;
  position:relative;
  background:
    linear-gradient(90deg, rgba(239,68,68,.96) 0%, rgba(251,146,60,.96) 50%, rgba(245,158,11,.96) 100%);
}
.adTopBar::after{
  content:"";
  position:absolute; left:0; right:0; bottom:0; height:4px;
  background: linear-gradient(90deg, rgba(255,255,255,.0), rgba(255,255,255,.9), rgba(255,255,255,.0));
  opacity:.7;
}
.adTopRow{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.adTitleWrap{display:flex;flex-direction:column;gap:4px;min-width:0;}
.adTitle1{
  font-weight:1000;
  letter-spacing:-.8px;
  color:#fff;
  font-size:18px;
  line-height:1.1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-shadow:0 2px 10px rgba(0,0,0,.25);
}
.adTitle2{
  font-weight:1000;
  letter-spacing:-.2px;
  color: rgba(255,255,255,.95);
  font-size:13px;
  text-shadow:0 2px 10px rgba(0,0,0,.20);
}
.adClose{
  width:40px; height:40px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.55);
  background: rgba(255,255,255,.18);

  cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  font-weight:1000;
}
.adClose:active{transform: translateY(1px); filter:brightness(.98);}

.adBody{
  padding: 12px 14px 14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.adCTAs{display:flex;gap:10px;align-items:stretch;}
.adBtn{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:16px;
  border:1px solid rgba(15,23,42,.12);
  background: #fff;

  text-decoration:none;

  font-size:16px;

}

.adBtn.kakao{

}

}
.adBtn svg{width:20px;height:20px;stroke: currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}

.adFoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding: 2px 2px 10px;}

.adCheck input{width:18px;height:18px; accent-color: #22c55e;}
.adSmall{color: rgba(71,85,105,.85);font-weight:1000;font-size:12px;}

/* =========================
   ✅ 부가서비스 팝업 목록(가독성/강조)
   ========================= */
.addonPop{
  border:1px solid rgba(15,23,42,.10);
  background: rgba(255,255,255,.72);
  border-radius:16px;
  padding:12px 12px;
}
.addonPop .h{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:10px;
}
.addonPop .carrierPill{
  font-size:12px;font-weight:1000;padding:6px 10px;border-radius:999px;color:#fff;white-space:nowrap;
}
.addonPop .carrierPill.sk{background:var(--sk);}
.addonPop .carrierPill.kt{background:var(--kt);}
.addonPop .carrierPill.lg{background:var(--lg);}
.addonPop .ttl{
  font-size:15px;font-weight:1000;letter-spacing:-.3px;color:#0f172a;
}
.addonPop ol{ margin:0; padding-left:18px; }
.addonPop li{
  margin:10px 0;
  font-size:15px;
  font-weight:1000;
  color:#0f172a;
  line-height:1.25;
}
.addonPop .sub{
  margin-top:4px;
  font-size:14px;
  font-weight:1000;
  color: rgba(71,85,105,.92);
}

/* =========================
   ✅ TODAY 카드: 쿠팡식 슬라이드 + 프리뷰 + 물결 스케일
   ========================= */
.todaySlider{ position:relative; overflow:hidden; }
.todayTrack{
  display:flex; gap:10px; overflow-x:auto;
  padding: 0 8px; /* ✅ 프리뷰 6~8px */
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  scroll-behavior:smooth;
}
.todayTrack::-webkit-scrollbar{display:none;}

.todayItem{
  flex: 0 0 calc(100% - 16px);
  scroll-snap-align:center;
  border-radius:18px;
  border:1px solid rgba(15,23,42,.10);
  background:#fff;
  box-shadow: 0 12px 24px rgba(15,23,42,.08);
  padding:14px;
  position:relative;
  overflow:hidden;
  transform: scale(1);
  transition: transform .16s ease;
}

/* ✅ 좌→우 그라데이션 번쩍 (0원/마이너스일 때만 ON) */
.todayItem.sweepOn::after{
  content:"";
  position:absolute; inset:-80px;
  background: linear-gradient(90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.0) 35%,
    rgba(255,255,255,.65) 50%,
    rgba(255,255,255,0) 65%,
    rgba(255,255,255,0) 100%);
  transform: translateX(-60%);
  animation: sweep 1.2s linear infinite;
  opacity:.55;
  pointer-events:none;
}
@keyframes sweep{
  0%{ transform: translateX(-70%); }
  100%{ transform: translateX(70%); }
}

/* 상단 “오늘의 초특가” 마퀴 띠 */
.todayMarquee{
  position:absolute; left:0; right:0; top:0;
  height:34px;
  display:flex; align-items:center;
  background: linear-gradient(90deg, rgba(15,23,42,.0), rgba(15,23,42,.06), rgba(15,23,42,.0));
  border-bottom:1px solid rgba(15,23,42,.10);
}
.todayMarquee .bar{ width:100%; height:100%; display:flex; align-items:center; overflow:hidden; }
.todayMarquee .text{
  display:inline-flex; align-items:center; gap:12px;
  white-space:nowrap;
  padding-left:100%;
  animation: marquee 6.5s linear infinite;
  font-weight:1000; letter-spacing:-.4px; font-size:13px;
  color:#fff;
  text-shadow:0 8px 16px rgba(0,0,0,.20);
}
@keyframes marquee{ 0%{ transform: translateX(0); } 100%{ transform: translateX(-100%); } }

/* 통신사별 마퀴 색상 */
.todayItem[data-carrier="SK"] .todayMarquee{ background: linear-gradient(90deg, rgba(37,99,235,.98), rgba(14,165,233,.85)); }
.todayItem[data-carrier="KT"] .todayMarquee{ background: linear-gradient(90deg, rgba(17,24,39,.98), rgba(71,85,105,.90)); }
.todayItem[data-carrier="LG"] .todayMarquee{ background: linear-gradient(90deg, rgba(22,163,74,.98), rgba(34,197,94,.85)); }

/* 내부 배지/모델/가격 */
.todayInner{padding-top:34px;}
.todayBadgeRow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.todayTag{
  display:inline-flex;align-items:center;gap:8px;
  font-weight:1000;font-size:12px;
  padding:7px 10px;border-radius:999px;color:#fff;
  background: linear-gradient(90deg, rgba(239,68,68,.96), rgba(245,158,11,.96));

const KAKAO_URL = "https://open.kakao.com/o/s729bI5h";

/* =========================

   ========================= */
const FALLBACK_NOTICE_VERSION = "2026-02-01-01";
const FALLBACK_NOTICE_TITLE   = "KT 위약금 면제 13일 종료 !!!";
const FALLBACK_NOTICE_SUBTITLE= "해당 고객은 조건 확인이 필요합니다. 카톡에 “기종/통신사”만 보내주세요.";
const FALLBACK_NOTICE_TAGS    = ["위약금","면제","마감임박","조건문의"];
const FALLBACK_NOTICE_URGENT  = false; // ✅ 초기값 urgent 포함(확장 시 안전)

/* ✅ 2시간 간격 - TODAY용 */
const POPUP_INTERVAL_MS = 2 * 60 * 60 * 1000;
const POPUP_FIRST_DELAY_MS = 700;

const NOTICE_SEEN_VER_KEY = "NOTICE_SEEN_VERSION";

const NOTICE_ADMIN_ON_KEY = "NOTICE_ADMIN_ON"; // "1"이면 ON, 그 외는 OFF

let NOTICE = {
  version: FALLBACK_NOTICE_VERSION,
  title: FALLBACK_NOTICE_TITLE,
  subtitle: FALLBACK_NOTICE_SUBTITLE,
  tags: FALLBACK_NOTICE_TAGS,
  urgent: FALLBACK_NOTICE_URGENT
};

/* ✅ notice.json 로딩 */
async function loadNoticeFromJSON(){
  try{
    const r = await fetch(`notice.json?v=${encodeURIComponent(NOTICE_JSON_VER)}`, { cache:"no-store" });
    if(!r.ok) throw new Error("notice.json load fail");
    const j = await r.json();

    const ver = String(j.version ?? "").trim();
    const title = String(j.title ?? "").trim();
    const sub = String(j.subtitle ?? "").trim();
    const tags = Array.isArray(j.tags) ? j.tags.map(x=>String(x||"").trim()).filter(Boolean) : [];
    const urgent = !!j.urgent;

    return {
      version: ver || FALLBACK_NOTICE_VERSION,
      title: title || FALLBACK_NOTICE_TITLE,
      subtitle: sub || FALLBACK_NOTICE_SUBTITLE,
      tags: tags.length ? tags : (FALLBACK_NOTICE_TAGS.slice()),
      urgent
    };
  }catch(e){
    return {
      version: FALLBACK_NOTICE_VERSION,
      title: FALLBACK_NOTICE_TITLE,
      subtitle: FALLBACK_NOTICE_SUBTITLE,
      tags: FALLBACK_NOTICE_TAGS.slice(),
      urgent: FALLBACK_NOTICE_URGENT
    };
  }
}

/* ✅ TODAY 하루차단(오늘만) */
function getTodayBlockAllKey(){
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(new Date());
  const get = (t) => (parts.find(p => p.type === t)?.value || "");
  const y = get("year"), m = get("month"), d = get("day");
  return `TODAY_POPUP_BLOCKALL_${y}-${m}-${d}`;
}

  }).formatToParts(new Date());

  return `TODAY_POPUP_ROTATE_${y}-${m}-${d}`;

let mode = "PHONE";

let mvnoNet = "LG";
let inetCarrier = "SK";

/* =========================
   ✅ StorageSafe
   ========================= */
const StorageSafe = (() => {
  const mem = new Map();
  function getStore(){
    try{
      const t="__t__";
      localStorage.setItem(t,"1");
      localStorage.removeItem(t);
      return localStorage;
    }catch(e){
      try{
        const t="__t__";
        sessionStorage.setItem(t,"1");
        sessionStorage.removeItem(t);
        return sessionStorage;
      }catch(e2){
        return null;
      }
    }
  }
  const store = getStore();
  return {
    get(key){
      try{ if(store) return store.getItem(key); }catch(e){}
      return mem.has(key) ? mem.get(key) : null;
    },
    set(key,val){
      try{ if(store) return store.setItem(key, String(val)); }catch(e){}
      mem.set(key, String(val));
    },
    remove(key){
      try{ if(store) return store.removeItem(key); }catch(e){}
      mem.delete(key);
    }
  };
})();

/* 업데이트 날짜/시간 자동 표시 (data.csv Last-Modified) */
async function setUpdateStamp(){

  if(!el) return;
  try{
    const res = await fetch(`data.csv?v=${encodeURIComponent(CSV_VER)}`, { method: "HEAD", cache: "no-store" });
    const lm = res.headers.get("last-modified");
    if(!lm) return;
    const d = new Date(lm);
    const parts = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(d);
    const get = (t) => (parts.find(p => p.type === t)?.value || "");
    el.textContent = `${get("year")}.${get("month")}.${get("day")} ${get("hour")}:${get("minute")}`;
  }catch(e){}
}

    if(e.target && e.target.closest && e.target.closest(".heroRefreshBtn")) return;

/* =========================
   ✅ data.csv에서 부가서비스 로딩 (__ADDON__ 행)
   - 포맷(2번):  항목1::설명1|항목2::설명2|...
   - 컬럼: SK_부가 / KT_부가 / LG_부가
   ========================= */
let ADDON_DATA = {
  SK: { items: [] },
  KT: { items: [] },
  LG: { items: [] }
};

function parseAddonCell(raw){
  const s = String(raw ?? "").trim();
  if(!s) return [];
  // 항목1::설명1|항목2::설명2 ...
  return s.split("|")
    .map(x => String(x||"").trim())
    .filter(Boolean)
    .map(seg => {
      const parts = seg.split("::");
      const t = String(parts[0] ?? "").trim();
      const d = String(parts.slice(1).join("::") ?? "").trim();
      return { t: t || "-", d: d || "" };
    });
}

function extractAddonFromRows(rows){
  const addonRow = rows.find(r => String(r["기종"] ?? "").trim() === "__ADDON__");
  if(!addonRow){
    return {
      SK: { items: [] },
      KT: { items: [] },
      LG: { items: [] }
    };
  }
  return {
    SK: { items: parseAddonCell(addonRow["SK_부가"]) },
    KT: { items: parseAddonCell(addonRow["KT_부가"]) },
    LG: { items: parseAddonCell(addonRow["LG_부가"]) }
  };
}

/* 숫자 판단(색상/정렬용) */
const asNum = (x) => {
  const raw = String(x ?? "").replace(/\u2212/g, "-").replace(/,/g, "").trim();
  if (!raw) return null;
  const m = raw.match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  let n = Number(m[0]);
  if (!Number.isFinite(n)) return null;
  if (raw.includes("만원") || raw.includes("만")) n = n * 10000;
  return n;
};
const showVal = (raw) => {
  const s = String(raw ?? "").replace(/\u2212/g, "-").trim();
  return s === "" ? "" : s;
};
const vClass = (n) => (n === null) ? "" : (n < 0 ? "neg" : (n === 0 ? "zero" : "pos"));

/* CSV loader */
function parseCSVLine(line){
  const out = [];
  let cur = "";
  let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"'){
      if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
      else inQ = !inQ;
      continue;
    }
    if(ch === "," && !inQ){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}
async function fetchCSV(){
  const r = await fetch(`data.csv?v=${encodeURIComponent(CSV_VER)}`, { cache: "no-store" });
  if (!r.ok) throw new Error("data.csv 로드 실패");
  const t = await r.text();
  const lines = t.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  if (!lines.length) return [];
  const header = parseCSVLine(lines.shift()).map(s => String(s||"").trim());
  return lines.map(line => {
    const cols = parseCSVLine(line);
    const o = {};
    header.forEach((h,i)=> o[h] = String(cols[i] ?? "").trim());
    return o;
  });
}

/* ✅ 정렬용 */
function getRowBestPrice(row, carrier){
  const mv = asNum(row[`${carrier}_이동`]);
  const ch = asNum(row[`${carrier}_기변`]);
  if(mv === null && ch === null) return Number.POSITIVE_INFINITY;
  if(mv === null) return ch;
  if(ch === null) return mv;
  return Math.min(mv, ch);
}

const adBackdrop = document.getElementById("adBackdrop");

function showModal(modal){
  adBackdrop.classList.add("show");
  modal.classList.add("show");
  modal.setAttribute("aria-hidden","false");
  adBackdrop.setAttribute("aria-hidden","false");
}
function hideModal(modal){
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden","true");
  if(!todayModal.classList.contains("show") && !noticeModal.classList.contains("show") && !addonModal.classList.contains("show")){
    adBackdrop.classList.remove("show");
    adBackdrop.setAttribute("aria-hidden","true");
  }
}

  if(addonModal.classList.contains("show")) hideModal(addonModal);
});

/* ✅ 공지 팝업 렌더/로직 */
function escapeHtml(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

/* (선택) 공지 강조 순서 개선 */
function highlightNoticeTitle(t){
  let s = escapeHtml(t);

  // 1) D- 먼저 강조
  s = s.replace(/(D-\d+)/g, '<span class="hlClose">$1</span>');
  // 2) 키워드 강조
  s = s.replace(/(마감|종료|오늘|긴급)/g, '<span class="hlClose">$1</span>');
  // 3) 숫자 강조
  s = s.replace(/(\d+)/g, '<span class="hlNum">$1</span>');

  return s;
}

function renderNoticeBanner(){
  const box = document.getElementById("noticeBanner");
  if(!box) return;

  const urgent = !!NOTICE.urgent || /마감|종료|긴급|D-\d+/i.test(String(NOTICE.title||""));
  box.classList.toggle("urgent", urgent);

  const tags = (NOTICE.tags || []).slice(0, 8);
  box.innerHTML = `
    <div class="noticeBadge">공지</div>
    <div class="noticeTitle">${highlightNoticeTitle(NOTICE.title || "")}</div>
    <div class="noticeSub">${escapeHtml(NOTICE.subtitle || "")}</div>
    <div class="noticeTags">
      ${tags.map(t=>`<span class="noticeTag">#${escapeHtml(t)}</span>`).join("")}
    </div>
  `;
}

/* ✅ 부가서비스 팝업(CTA 클릭 = 여기 열기) */
function addonCarrierClass(c){
  if(c==="SK") return "sk";
  if(c==="KT") return "kt";
  return "lg";
}
function renderAddonPopup(carrier){
  const box = document.getElementById("addonPopBody");
  const title = document.getElementById("addonTitle");
  if(!box || !title) return;

  const items = (ADDON_DATA?.[carrier]?.items || []);
  title.textContent = `${carrier} 부가서비스 유지조건`;

  if(!items.length){
    box.innerHTML = `
      <div class="addonPop">
        <div class="h">
          <div class="ttl">등록된 유지조건이 없습니다</div>
          <span class="carrierPill ${addonCarrierClass(carrier)}">${carrier}</span>
        </div>
        <div style="font-weight:1000;color:rgba(71,85,105,.92);line-height:1.35;">
          data.csv의 <strong>__ADDON__</strong> 행에서 <strong>${carrier}_부가</strong>를 입력하세요.
        </div>
      </div>
    `;
    return;
  }

  const lis = items.map(x => `
    <li>
      ${escapeHtml(x.t)}
      ${x.d ? `<div class="sub">${escapeHtml(x.d)}</div>` : ``}
    </li>
  `).join("");

  box.innerHTML = `
    <div class="addonPop">
      <div class="h">
        <div class="ttl">필수확인 · 미가입/미유지 시 추가요금 가능</div>
        <span class="carrierPill ${addonCarrierClass(carrier)}">${carrier}</span>
      </div>
      <ol>${lis}</ol>
    </div>
  `;
}
function openAddonModal(carrier){
  renderAddonPopup(carrier);
  showModal(addonModal);
}
document.getElementById("addonCloseBtn").addEventListener("click", ()=> hideModal(addonModal));
document.getElementById("addonOkBtn").addEventListener("click", ()=> hideModal(addonModal));

list.addEventListener("click", (e)=>{

/* ✅ TODAY 팝업 렌더/로직 */
const todayTrack = document.getElementById("todayTrack");
const todayDots = document.getElementById("todayDots");
const todayNoShowToday = document.getElementById("todayNoShowToday");

function carrierClass(c){
  if(c==="SK") return "sk";
  if(c==="KT") return "kt";
  return "lg";
}
function buildTodayCards(todayRows){
  todayTrack.innerHTML = "";
  todayDots.innerHTML = "";

  if(!todayRows.length){
    todayTrack.innerHTML = `<div class="todayItem"><div class="todayInner"><div class="todayModel">오늘의 카드가 없습니다</div><div class="todayInfo">TODAY=1 로 지정된 행이 없어요.</div></div></div>`;
    return;
  }

  /* ✅ TODAY는 "최저(가장 낮은 값, 마이너스 우선)" 기준으로 시작 */
  const scoreRow = (r) => {
    const carriers = ["SK","KT","LG"];
    let best = Number.POSITIVE_INFINITY;
    carriers.forEach(c=>{
      best = Math.min(best, getRowBestPrice(r, c));
    });
    return best;
  };

  const sorted = todayRows.slice().sort((a,b)=>{
    const av = scoreRow(a);
    const bv = scoreRow(b);
    if(av !== bv) return av - bv;
    const am = String(a["기종"] ?? "");
    const bm = String(b["기종"] ?? "");
    return am.localeCompare(bm, "ko");
  });

  // 로테이션은 유지(날짜 단위)하되, 정렬된 배열 기준으로 회전
  const rKey = getRotateKey();
  const cur = Number(StorageSafe.get(rKey) ?? "0");
  const startIdx = (Number.isFinite(cur) ? cur : 0) % sorted.length;
  StorageSafe.set(rKey, String(startIdx + 1));

  const rotated = sorted.slice(startIdx).concat(sorted.slice(0, startIdx));

  rotated.forEach((r, idx)=>{
    // ✅ 카드 내부는 "행에서 실제 값이 있는 통신사"를 우선 표시
    const pickCarrier = () => {
      const cands = ["SK","KT","LG"];
      let bestC = lastPhoneTab || "SK";
      let bestV = Number.POSITIVE_INFINITY;
      cands.forEach(c=>{
        const v = getRowBestPrice(r, c);
        if(v < bestV){
          bestV = v; bestC = c;
        }
      });
      return bestC;
    };
    const c = pickCarrier();

    const model = String(r["기종"] ?? "").trim() || "-";
    const mv = showVal(r[`${c}_이동`]);
    const ch = showVal(r[`${c}_기변`]);

    const mvNum = asNum(mv);
    const chNum = asNum(ch);
    const hasMove = (mv !== "");
    const hasChange = (ch !== "");
    const one = !(hasMove && hasChange);

    const best = getRowBestPrice(r, c);
    const sweepOn = (best !== Number.POSITIVE_INFINITY) && (best <= 0);

    todayTrack.insertAdjacentHTML("beforeend", `
      <div class="todayItem ${sweepOn ? "sweepOn" : ""}" data-carrier="${c}">
        <div class="todayMarquee">
          <div class="bar">
            <div class="text">오늘의 초특가 · TODAY · TODAY · TODAY · 오늘의 초특가 · TODAY · TODAY ·</div>
          </div>
        </div>

        <div class="todayInner">
          <div class="todayBadgeRow">
            <div class="todayTag">TODAY</div>
            <div class="todayCarrier ${carrierClass(c)}">${c}</div>
          </div>

          <div class="todayModel">${escapeHtml(model)}</div>
          <div class="todayInfo">${escapeHtml(infoLineWithPlan(c, r))}</div>
          ${isDiscountRow(r) ? `<div class="todayDiscPill">요금할인 <strong>25%</strong></div>` : ``}

          <div class="todayPrices ${one ? "one" : ""}">
            ${hasMove ? `
              <div class="todayPriceBox">
                <div class="k">이동</div>
                <div class="v ${vClass(mvNum)}">${escapeHtml(mv)}</div>
              </div>` : ``}
            ${hasChange ? `
              <div class="todayPriceBox">
                <div class="k">기변</div>
                <div class="v ${vClass(chNum)}">${escapeHtml(ch)}</div>
              </div>` : ``}
          </div>
        </div>
      </div>
    `);

    todayDots.insertAdjacentHTML("beforeend", `<div class="todayDot ${idx===0 ? "active" : ""}"></div>`);
  });

  const items = Array.from(todayTrack.querySelectorAll(".todayItem"));
  const dots = Array.from(todayDots.querySelectorAll(".todayDot"));
  function setActive(i){
    dots.forEach((d,idx)=> d.classList.toggle("active", idx===i));
  }
  todayTrack.addEventListener("scroll", ()=>{
    let bestIdx = 0;
    let bestDist = Infinity;
    items.forEach((el, idx)=>{
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const containerRect = todayTrack.getBoundingClientRect();
      const cc = containerRect.left + containerRect.width/2;
      const dist = Math.abs(cx - cc);
      if(dist < bestDist){ bestDist = dist; bestIdx = idx; }
    });
    setActive(bestIdx);
  }, { passive:true });
}

/* TODAY 팝업 표시 판단 */
function shouldShowTodayPopup(){
  const blockKey = getTodayBlockAllKey();
  if(String(StorageSafe.get(blockKey) ?? "") === "1") return false;

  const last = Number(StorageSafe.get(POPUP_LAST_SHOWN_KEY) ?? "0");
  const now = Date.now();
  if(!last) return true;
  return (now - last) >= POPUP_INTERVAL_MS;
}
function markTodayShown(){
  StorageSafe.set(POPUP_LAST_SHOWN_KEY, String(Date.now()));
}

/* TODAY 팝업 버튼 */
document.getElementById("todayCloseBtn").addEventListener("click", ()=>{
  if(todayNoShowToday.checked){
    StorageSafe.set(getTodayBlockAllKey(), "1");
  }
  hideModal(todayModal);
});
document.getElementById("todayOkBtn").addEventListener("click", ()=>{
  if(todayNoShowToday.checked){
    StorageSafe.set(getTodayBlockAllKey(), "1");
  }
  hideModal(todayModal);
});

/* 탭 이벤트 */
serviceTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".tabBtn");
  if(!b) return;
  const next = b.dataset.mode;
  if(next === "MVNO"){
    mode = "MVNO";
    setServiceActive("MVNO");
    hideAllSubTabs();
    showMvnoTabs(true);
    showInternetTabs(false);
    renderMVNO(mvnoNet);
    activateMvnoNet(mvnoNet);
  }else if(next === "INTERNET"){
    mode = "INTERNET";
    setServiceActive("INTERNET");
    hideAllSubTabs();
    showInternetTabs(true);
    showMvnoTabs(false);
    renderInternet(inetCarrier);
    activateInetCarrier(inetCarrier);
  }
});

phoneTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".tabBtn");
  if(!b) return;
  const tab = b.dataset.tab;
  mode = "PHONE";
  setServiceActive(null);
  hideAllSubTabs();
  activatePhoneTab(tab);
  if(window.__CSV_ROWS__) renderPhone(window.__CSV_ROWS__, tab);
});

mvnoTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".subTabBtn");
  if(!b) return;
  const net = b.dataset.mvno;
  activateMvnoNet(net);
  renderMVNO(net);
});
internetTabsEl.addEventListener("click", (e)=>{
  const b = e.target.closest(".subTabBtn");
  if(!b) return;
  const c = b.dataset.inet;
  activateInetCarrier(c);
  renderInternet(c);
});

/* =========================
   ✅ 초기 로딩
   ========================= */
(async function init(){
  showLoading("data.csv 불러오는 중…");
  await setUpdateStamp();

  try{
    NOTICE = await loadNoticeFromJSON();

    const rows = await fetchCSV();
    window.__CSV_ROWS__ = rows;

    // ✅ 부가서비스: data.csv __ADDON__ 행에서 추출
    ADDON_DATA = extractAddonFromRows(rows);

    mode = "PHONE";
    setServiceActive(null);
    hideAllSubTabs();
    activatePhoneTab(lastPhoneTab);
    renderPhone(rows, lastPhoneTab);

    /* ✅ 공지 팝업: 기본 OFF, 관리자 ON일 때만 동작 */
    setTimeout(()=>{
      const on = (String(StorageSafe.get(NOTICE_ADMIN_ON_KEY) ?? "") === "1");
      if(on) maybeShowNoticePopup();
    }, 300);

    /* ✅ TODAY 팝업(2시간 기준)
       - 요청: 표시 “순간” markTodayShown() 먼저 찍기(중복/재등장 체감 방지)
    */
    const todayRows = rows
      .filter(isTodayRow)
      .filter(r => {
        const m = String(r["기종"] ?? "").trim();
        return (m !== "__NOTICE__" && m !== "__ADDON__");
      });

    if(todayRows.length){
      buildTodayCards(todayRows);

      setTimeout(()=>{
        if(shouldShowTodayPopup()){
          markTodayShown();     // ✅ 먼저 기록
          showModal(todayModal);
        }
      }, POPUP_FIRST_DELAY_MS);

      setInterval(()=>{
        if(shouldShowTodayPopup()){
          todayNoShowToday.checked = false;
          markTodayShown();     // ✅ 먼저 기록
          showModal(todayModal);
        }
      }, 30 * 1000);
    }

  }catch(err){
    console.error(err);
    showLoading("data.csv를 불러오지 못했습니다. 파일명/경로를 확인해주세요.");
  }
})();
</script>
